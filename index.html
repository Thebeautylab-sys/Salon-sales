<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7B1E3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Salon Sales">
<title>Salon Sales, The Beauty Lab</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2F5;--surface:#FFFFFF;--sunk:#EDE7EE;--ink:#241A26;--muted:#6E6371;--line:#E4DCE5;
  --wine:#7B1E3A;--wine-soft:#F3E3E8;--on-wine:#FFFFFF;
  --ok:#2E7452;--warn:#A86412;--bad:#B42318;--ok-soft:#E3F1EA;--warn-soft:#FAEEDC;--bad-soft:#FBE6E3;
  --s-lead:#8A7CB2;--s-sampled:#C9668F;--s-follow:#D08A2C;--s-customer:#2E7452;--s-lost:#A09AA2;
  --shadow:0 1px 0 rgba(36,26,38,.04),0 8px 24px -12px rgba(36,26,38,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161116;--surface:#211A21;--sunk:#2B222B;--ink:#F3EDF3;--muted:#ABA0AC;--line:#3A2F3A;
  --wine:#E07A9A;--wine-soft:#3A1F2A;--on-wine:#1C1218;
  --ok:#6CC69A;--warn:#E5A955;--bad:#F07B6E;--ok-soft:#1E3329;--warn-soft:#3A2B17;--bad-soft:#3D1D1A;
  --s-lead:#A99BD3;--s-sampled:#E58AB0;--s-follow:#E8A64E;--s-customer:#6CC69A;--s-lost:#8C858E;
  --shadow:0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#161116;--surface:#211A21;--sunk:#2B222B;--ink:#F3EDF3;--muted:#ABA0AC;--line:#3A2F3A;
  --wine:#E07A9A;--wine-soft:#3A1F2A;--on-wine:#1C1218;
  --ok:#6CC69A;--warn:#E5A955;--bad:#F07B6E;--ok-soft:#1E3329;--warn-soft:#3A2B17;--bad-soft:#3D1D1A;
  --s-lead:#A99BD3;--s-sampled:#E58AB0;--s-follow:#E8A64E;--s-customer:#6CC69A;--s-lost:#8C858E;
  --shadow:0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 "Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;letter-spacing:-.01em;margin:0}
h1{font-size:30px;line-height:1.1;font-weight:700}
h2{font-size:19px;font-weight:650}
h3{font-size:16px;font-weight:650}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--wine)}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12px}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 120px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 12px;max-width:720px;margin:0 auto}
.topbar .title{flex:1;font-weight:650;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib:active{background:var(--sunk)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hello{padding:8px 0 18px}
.hello p{margin:6px 0 0}
/* swatch: the signature element, a glossy gel cap */
.sw{--c:var(--s-lead);width:14px;height:14px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 14%,transparent 34%),var(--c);box-shadow:inset 0 -2px 3px rgba(0,0,0,.18)}
.sw.big{width:58px;height:58px;box-shadow:inset 0 -6px 10px rgba(0,0,0,.2),0 6px 18px -6px var(--c)}
.sw[data-s="Sampled"]{--c:var(--s-sampled)} .sw[data-s="Follow-up"]{--c:var(--s-follow)} .sw[data-s="Customer"]{--c:var(--s-customer)} .sw[data-s="Lost"]{--c:var(--s-lost)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:600;white-space:nowrap;border:0}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.wine{background:var(--wine-soft);color:var(--wine)}
.block{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin:10px 0 22px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px}
.sec a,.link{font-size:14px;font-weight:600;color:var(--wine);background:none;border:0;cursor:pointer;padding:4px}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:active{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex:none}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.stat{background:var(--surface);padding:14px 16px}
.stat .v{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:22px;font-weight:700;line-height:1.15}
.stat .l{font-size:13px;color:var(--muted)}
.focus{display:flex;align-items:center;gap:14px;padding:18px;background:var(--wine);color:var(--on-wine);border-radius:20px;margin:4px 0 22px;border:0;width:100%;text-align:left;cursor:pointer}
.focus .n{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:44px;font-weight:700;line-height:1}
.focus .x{font-size:15px;opacity:.92}
.pipe{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:14px 16px 6px;background:var(--sunk)}
.pipe span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 16px 14px}
.legend button{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;font-size:14px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:0 12px;box-shadow:var(--shadow);margin:4px 0 12px}
.search input{border:0;background:transparent;padding:13px 0;flex:1;outline:none;min-width:0}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;margin:6px 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hero{display:flex;gap:16px;align-items:center;padding:6px 0 16px}
.hero h1{font-size:26px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:16px;background:var(--surface);border:0;box-shadow:var(--shadow);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.act svg.i{color:var(--wine)}
.act:active{transform:scale(.97)}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin:0 0 14px}
.card.due{border-left:5px solid var(--warn)} .card.late{border-left:5px solid var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;padding:14px 16px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;word-break:break-word}
.tl{padding:6px 16px 8px}
.tl .it{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tl .it:first-child{border-top:0}
.tl .dot{width:32px;height:32px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--wine)}
.tl .dot svg.i{width:17px;height:17px}
.tl .body{flex:1;min-width:0}
.tl .body p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:650;cursor:pointer;background:var(--wine);color:var(--on-wine);font-size:16px}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.line{background:transparent;color:var(--wine);box-shadow:inset 0 0 0 1.5px var(--wine)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
.btn.block{display:flex;width:100%;box-shadow:none;margin:0}
.btn[disabled]{opacity:.5;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 10px 24px -8px rgba(123,30,58,.6);border-radius:18px;padding:14px 18px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{display:flex;max-width:720px;margin:0 auto}
.tabbar button{flex:1;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabbar button.on{color:var(--wine)}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;padding:1px 6px;font-weight:700}
/* forms */
.f{display:block;margin:0 0 14px}
.f>span{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin:0 0 6px}
.f input,.f select,.f textarea,.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 13px;font-size:16px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{border-color:var(--wine)}
.f textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fs{margin:6px 0 4px;font-weight:650;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:16px;padding-top:10px;border-top:1px solid var(--line)}
.fs:first-child{border-top:0;padding-top:0}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,18,.45);z-index:40;animation:fade .18s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:24px 24px 0 0;max-height:calc(100% - 40px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:14px 12px 8px 20px}
.sheet .sh h2{flex:1}
.sheet .sb{overflow:auto;padding:6px 20px 16px;-webkit-overflow-scrolling:touch}
.sheet .sf{padding:10px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14.5px;box-shadow:var(--shadow);animation:fade .2s;max-width:86vw}
#toast div.bad{background:var(--bad);color:#fff}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;z-index:70;background:linear-gradient(90deg,transparent,var(--wine),transparent);background-size:50% 100%;animation:slide 1s linear infinite;display:none}
#bar.on{display:block}
@keyframes slide{from{background-position:-50% 0}to{background-position:150% 0}}
/* order editor */
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .nm{flex:1;min-width:0;font-weight:600;font-size:15px}
.step{display:flex;align-items:center;background:var(--sunk);border-radius:11px}
.step button{width:34px;height:34px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--ink)}
.step input{width:46px;text-align:center;border:0;background:transparent;padding:6px 0;font-weight:700;outline:none;-moz-appearance:textfield}
.price{width:78px;border:1px solid var(--line);border-radius:10px;padding:7px 8px;text-align:right;background:var(--surface)}
.tot{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
.tot>span:nth-child(even){text-align:right;white-space:nowrap}
.tot .big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:22px;padding-top:6px;border-top:1px solid var(--line)}
.results{max-height:240px;overflow:auto;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);margin:-4px 0 14px}
.results .row{padding:10px 14px}
.steps{display:flex;gap:4px;margin:4px 0 16px}
.steps div{flex:1;height:6px;border-radius:9px;background:var(--sunk)}
.steps div.on{background:var(--wine)}
.warnbox{background:var(--warn-soft);color:var(--warn);padding:10px 13px;border-radius:12px;font-size:14px;font-weight:600;margin:8px 0}
/* invoice */
.inv{background:#fff;color:#1d141f;border-radius:6px;padding:28px 24px;box-shadow:var(--shadow);font-size:14px;line-height:1.45}
.inv h1{font-size:24px;color:#7B1E3A}
.inv table{width:100%;border-collapse:collapse;margin:18px 0}
.inv th{text-align:left;font-size:12px;color:#6d6270;border-bottom:1.5px solid #1d141f;padding:6px 4px;font-weight:600}
.inv td{padding:8px 4px;border-bottom:1px solid #e8e2e9;vertical-align:top}
.inv .r{text-align:right;white-space:nowrap}
.inv .meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px}
.inv .sum{margin-left:auto;max-width:300px;display:grid;grid-template-columns:1fr auto;gap:4px 18px}
.inv .sum .g{font-weight:700;font-size:17px;border-top:1.5px solid #1d141f;padding-top:6px}
.login{max-width:400px;margin:0 auto;padding:12vh 24px 40px}
.login .sw.big{margin-bottom:22px}
.login h1{font-size:34px;margin-bottom:6px}
.bar2{height:8px;border-radius:9px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar2 span{display:block;height:100%;background:var(--wine);border-radius:9px}
@media print{
  body{background:#fff}.topbar,.tabbar,.fab,#toast,.noprint,body::before{display:none!important}
  .wrap{padding:0;max-width:none}.inv{box-shadow:none;padding:0}
  :root{padding:0}
}

svg.i.sm{width:15px;height:15px;vertical-align:-3px}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--wine-soft);color:var(--wine);font-weight:700;flex:none;margin-right:6px;vertical-align:middle}
.hist{padding:2px 14px 6px}
.day{font-size:13px;font-weight:700;color:var(--muted);padding:14px 2px 4px}
.hi{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.day+.hi,.hist>.hi:first-child{border-top:0}
.hi .dot{width:34px;height:34px;border-radius:11px;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--wine)}
.hi .dot svg.i{width:17px;height:17px}
.hi.t-visit .dot{background:var(--ok-soft);color:var(--ok)}
.hi.t-samples .dot{background:var(--wine-soft);color:var(--wine)}
.hi.t-followup .dot{background:var(--warn-soft);color:var(--warn)}
.hi.t-status .dot{background:var(--ink);color:var(--bg)}
.hi .body{flex:1;min-width:0}
.hi .hm{font-size:13px;color:var(--muted);margin-top:2px;display:flex;align-items:center;flex-wrap:wrap;gap:2px 6px}
.hi .hm a{display:inline-flex;align-items:center;gap:3px;text-decoration:none;font-weight:600}
.hi p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;font-size:15px}
.hx{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.hx .pill{font-weight:500;white-space:normal}
.fuline{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--sunk);font-size:14px}
.fuline>div{flex:1}
.fuline.late{background:var(--bad-soft);color:var(--bad)} .fuline.today{background:var(--warn-soft);color:var(--warn)}
.fuline.done{background:var(--ok-soft);color:var(--ok)} .fuline.done div div{color:var(--ink);margin-top:2px}
.lb{padding:4px 16px 10px}
.lh,.lr{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px 58px 40px;align-items:center;gap:4px;text-align:center}
.lh{font-size:12px;color:var(--muted);padding:8px 0 4px}
.lr{padding:9px 0;border-top:1px solid var(--line)}
.lr .nm{text-align:left;font-weight:600;display:flex;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}

.otl{padding:8px 16px}
.ost{display:flex;gap:12px;align-items:flex-start;padding:8px 0;position:relative}
.ost>span{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:5px;flex:none}
.ost.on>span{background:var(--wine);border-color:var(--wine)}
.ost:not(:last-child)::after{content:"";position:absolute;left:5px;top:22px;bottom:-6px;width:2px;background:var(--line)}

.net{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;display:flex;align-items:center;gap:8px;justify-content:center;padding:8px 14px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600}
.net.sync{background:var(--wine-soft);color:var(--wine)}
.tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;cursor:pointer;color:var(--on-wine);padding:0}
.tick.on{background:var(--wine);border-color:var(--wine)}
.tick[disabled]{opacity:.35}
.tick svg.i{width:18px;height:18px}
.planbar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;background:var(--surface);padding:10px 12px 10px 16px;border-radius:18px;box-shadow:0 10px 30px -10px rgba(36,26,38,.35);margin-top:8px}
.planbar>span{flex:1}
.tg{margin:4px 0 10px}
.tgh{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px}
.tgrid .f input{padding:10px}
.chk{display:flex;gap:10px;align-items:center;margin:-6px 0 14px;font-size:14.5px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--wine)}

</style>
<script src="config.js"></script>
</head>
<body>
<div id="bar"></div><div id="app"></div><div id="sheet-root"></div><div id="toast" aria-live="polite"></div>
<script>
/* ============================================================
 * The Beauty Lab · Salon Sales 2.1 · shared core
 * Compatible with data written by the first version of the app.
 * ============================================================ */
var STATUSES = ['Lead', 'Sampled', 'Follow-up', 'Customer', 'Lost'];
var CONTACT_TYPES = ['visit', 'call', 'whatsapp', 'email', 'meeting', 'samples'];

var TABLES = {
  salons: { sheet: 'Salons', key: 'id', head: ['id','name','owner','phone','whatsapp','instagram','email','emirate','area','address','lat','lng','mapsUrl','status','assignedTo','source','notes','createdAt','createdBy','updatedAt','lastContact','nextFollowup',
    'priority','decisionMaker','decisionRole','chairs','staff','brandsUsed','priceTier','hours','tags','lostReason','billingName','trn','zohoContactId'] },
  acts: { sheet: 'Activities', key: 'id', head: ['id','salonId','type','note','lat','lng','distance','at','by','followupDate','done','doneBy','outcome'] },
  samples: { sheet: 'Samples', key: 'id', head: ['id','salonId','activityId','product','qty','at','by'] },
  products: { sheet: 'Products', key: 'name', head: ['name','code','category','price','active','zohoItemId'] },
  orders: { sheet: 'Orders', key: 'id', head: ['id','orderNo','salonId','status','orderDate','deliveryDate','deliverySlot','deliveryAddress','deliveryArea','deliveryEmirate','contactName','contactPhone','paymentMethod','poRef','zohoInvoice',
    'units','subtotal','discountMode','discountPct','discount','deliveryMode','delivery','vatRate','vat','total','notes','createdAt','createdBy','updatedAt','submittedAt','submittedBy','invoicedAt','invoicedBy','deliveredAt','deliveredBy','cancelledAt','cancelReason','zohoInvoiceId','zohoStatus','zohoBalance','zohoTotal','zohoError','zohoSyncedAt'] },
  targets: { sheet: 'Targets', key: 'id', head: ['id','month','email','visits','newSalons','orders','units','value'] },
  items: { sheet: 'OrderItems', key: 'id', head: ['id','orderId','product','qty','price','lineTotal'] },
  settings: { sheet: 'Settings', key: 'key', head: ['key','value','help'] },
  users: { sheet: 'Users', key: 'email', head: ['email','name','role','pin','active','phone'] }
};

var DEFAULT_SETTINGS = [
  ['businessName', 'The Beauty Lab', 'Shown in WhatsApp messages'],
  ['brandName', 'JOIA Vegan', 'Brand you sell, used in WhatsApp messages'],
  ['cadenceLead', '3', 'Days to next follow-up for a Lead'],
  ['cadenceSampled', '7', 'Days to next follow-up after samples'],
  ['cadenceFollowup', '5', 'Days to next follow-up for Follow-up status'],
  ['cadenceCustomer', '30', 'Days to next check-in with a Customer'],
  ['checkinRadius', '150', 'Metres from the salon pin that count as "at the salon"'],
  ['orderPrefix', 'SO-', 'Sales order number prefix'],
  ['opsWhatsApp', '', 'WhatsApp number that receives new orders (the person who invoices in Zoho)'],
  ['minOrder', '500', 'Minimum order before VAT (AED)'],
  ['tier1Amount', '2000', 'Order value for discount tier 1 (AED)'],
  ['tier1Pct', '10', 'Tier 1 discount %'],
  ['tier2Amount', '5000', 'Order value for discount tier 2 (AED)'],
  ['tier2Pct', '15', 'Tier 2 discount %'],
  ['deliveryFee', '35', 'Delivery fee (AED)'],
  ['freeDeliveryOver', '', 'Free delivery from this amount. Empty = always charge'],
  ['vatEnabled', 'yes', 'yes or no'],
  ['vatRate', '5', 'VAT %'],
  ['commissionPct', '', 'Commission % of delivered order value before VAT. Empty = off'],
  ['commissionPerUnit', '', 'Or commission in AED per delivered unit. Empty = off'],
  ['zohoAutoInvoice', 'yes', 'yes = create the Zoho invoice automatically when an order is submitted'],
  ['zohoInvoiceAs', 'draft', 'draft or sent. Draft lets the office review before sending'],
  ['zohoTaxId', '', 'Zoho tax_id of your 5% VAT (find it with zohoListTaxes in Apps Script)'],
  ['zohoAccounts', 'https://accounts.zoho.com', 'Your Zoho login domain, e.g. https://accounts.zoho.com or https://accounts.zoho.eu'],
  ['zohoClientId', '', 'From api-console.zoho.com Self Client. Moved to a safe place after connecting'],
  ['zohoClientSecret', '', 'From the Self Client. Moved to a safe place after connecting'],
  ['zohoGrantCode', '', 'Generated code, valid 10 minutes. Then run zohoConnect']
];

/* ---------- utils ---------- */
function num(v) { var n = parseFloat(String(v === undefined || v === null ? '' : v).replace(/,/g, '')); return isNaN(n) ? 0 : n; }
function isTrue(v) { return v === true || /^(true|yes|y|1)$/i.test(String(v === undefined || v === null ? '' : v).trim()); }
function isDone(a) { var v = a.done; if (v === true) return true; var s = String(v === undefined || v === null ? '' : v).trim().toLowerCase(); return s !== '' && s !== 'false' && s !== 'no' && s !== '0'; }
function isOpenFu(a) { return !!String(a.followupDate || '').trim() && !isDone(a); }
function r2(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }
function calcTotals(items, S, o) {
  o = o || {};
  var sub = 0, units = 0;
  (items || []).forEach(function (i) { sub += num(i.qty) * num(i.price); units += num(i.qty); });
  sub = r2(sub);
  var t2 = num(S.tier2Amount), t1 = num(S.tier1Amount);
  var tier = (t2 > 0 && sub >= t2) ? num(S.tier2Pct) : (t1 > 0 && sub >= t1) ? num(S.tier1Pct) : 0;
  var pct = o.discountMode === 'manual' ? num(o.discountPct) : tier;
  var discount = r2(sub * pct / 100), net = r2(sub - discount);
  var fee = num(S.deliveryFee), freeOver = num(S.freeDeliveryOver);
  var delivery = !(items || []).length || sub === 0 ? 0 : o.deliveryMode === 'free' ? 0 : (freeOver > 0 && net >= freeOver ? 0 : fee);
  var vatRate = isTrue(S.vatEnabled) ? num(S.vatRate) : 0;
  var vat = r2((net + delivery) * vatRate / 100);
  return { units: units, subtotal: sub, tierPct: tier, discountPct: pct, discount: discount, delivery: r2(delivery), vatRate: vatRate, vat: vat, total: r2(net + delivery + vat), belowMin: sub > 0 && sub < num(S.minOrder) };
}
var NOW_OVERRIDE = '';
function nowISO() { return NOW_OVERRIDE || new Date().toISOString(); }
function todayStr() { return new Date(Date.now() + 4 * 3600000).toISOString().slice(0, 10); }
function addDays(d, n) { var t = new Date(String(d || todayStr()).slice(0, 10) + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + Number(n || 0)); return t.toISOString().slice(0, 10); }
function fail(msg) { throw new Error(msg); }
function pick(obj, head) { var o = {}; head.forEach(function (h) { if (obj[h] !== undefined) o[h] = obj[h]; }); return o; }
function lc(e) { return String(e || '').trim().toLowerCase(); }
function userActive(u) { return u.active === '' || u.active === undefined || u.active === null || isTrue(u.active); }
function pubUser(u) { return { email: lc(u.email), name: u.name || lc(u.email).split('@')[0], role: lc(u.role) === 'admin' ? 'admin' : 'user' }; }
function teamUser(u) { var p = pubUser(u); p.pin = String(u.pin === undefined || u.pin === null ? '' : u.pin); p.active = userActive(u) ? 'yes' : 'no'; p.phone = u.phone || ''; return p; }
function settingsObj(rows) { var s = {}; DEFAULT_SETTINGS.forEach(function (d) { s[d[0]] = d[1]; }); (rows || []).forEach(function (r) { if (r.key) s[String(r.key).trim()] = r.value === undefined || r.value === null ? '' : String(r.value); }); return s; }
function publicSettings(S) { var o = {}; for (var k in S) if (!/^zoho(ClientId|ClientSecret|GrantCode)$/.test(k)) o[k] = S[k]; return o; }
function cadenceFor(status, S) { return num({ 'Lead': S.cadenceLead, 'Sampled': S.cadenceSampled, 'Follow-up': S.cadenceFollowup, 'Customer': S.cadenceCustomer }[status] || S.cadenceFollowup) || 5; }

/* ============================================================
 * Actions. Need a global DB: uid(), all(t), upsert(t,obj), remove(t,pred)
 * Writes return { upsert: {table:[rows]}, remove: {table:[ids]} }
 * ============================================================ */
function newTx() { return { upsert: {}, remove: {} }; }
function put(tx, t, obj) { var row = DB.upsert(t, obj); (tx.upsert[t] = tx.upsert[t] || []).push(row); return row; }
function drop(tx, t, pred) { var ids = DB.remove(t, pred); if (ids.length) tx.remove[t] = (tx.remove[t] || []).concat(ids); }
function findRow(t, id) { var k = TABLES[t].key; return DB.all(t).filter(function (r) { return t === 'users' ? lc(r[k]) === lc(id) : String(r[k]) === String(id); })[0]; }
function S_() { return settingsObj(DB.all('settings')); }
function isAdmin(me) { return me.role === 'admin'; }
function needAdmin(me) { if (!isAdmin(me)) fail('Only an admin can do this.'); }

function addAct(tx, me, salonId, f) {
  var a = { id: DB.uid(), salonId: salonId, at: nowISO(), by: me.email, done: '' };
  for (var k in f) a[k] = f[k];
  return put(tx, 'acts', a);
}
function refreshSalon(tx, id, patch) {
  if (!findRow('salons', id)) return null;
  var open = DB.all('acts').filter(function (a) { return String(a.salonId) === String(id) && isOpenFu(a); })
    .map(function (a) { return String(a.followupDate).slice(0, 10); }).sort();
  var p = { id: id, nextFollowup: open[0] || '', updatedAt: nowISO() };
  for (var k in (patch || {})) p[k] = patch[k];
  return put(tx, 'salons', p);
}
function changeStatus(tx, me, salon, to, why) {
  var from = salon.status || 'Lead';
  if (from === to) return;
  addAct(tx, me, salon.id, { type: 'status', note: 'Status: ' + from + ' → ' + to + (why ? '. ' + why : '') });
  salon.status = to;
  put(tx, 'salons', { id: salon.id, status: to });
}

var API = {
  bootstrap: function (me) {
    var all = DB.all('users');
    var out = {
      me: me,
      users: all.filter(function (u) { return u.email; }).map(function (u) { var p = pubUser(u); p.active = userActive(u) ? 'yes' : 'no'; return p; }),
      salons: DB.all('salons'), acts: DB.all('acts'), samples: DB.all('samples'), orders: DB.all('orders'), items: DB.all('items'),
      products: DB.all('products').filter(function (p) { return p.name && userActive(p); }),
      targets: DB.all('targets'),
      settings: publicSettings(S_())
    };
    if (isAdmin(me)) out.team = all.filter(function (u) { return u.email; }).map(teamUser);
    return out;
  },

  saveSalon: function (me, p) {
    var tx = newTx(), s = pick(p.salon || {}, TABLES.salons.head), t = nowISO();
    ['lastContact', 'nextFollowup', 'createdAt', 'createdBy', 'updatedAt'].forEach(function (k) { delete s[k]; });
    var ex = s.id ? findRow('salons', s.id) : null;
    if (s.id && !ex) fail('Salon not found.');
    if ((!ex || s.name !== undefined) && !String(s.name || '').trim()) fail('Add the salon name.');
    var wantStatus = s.status;
    if (!ex) {
      s.id = DB.uid(); s.createdAt = t; s.createdBy = me.email; s.status = 'Lead';
      s.assignedTo = s.assignedTo || me.email;
      put(tx, 'salons', s);
      addAct(tx, me, s.id, { type: 'created', note: 'Salon added' + (s.source ? ' (' + s.source + ')' : '') });
      if (wantStatus && wantStatus !== 'Lead') changeStatus(tx, me, findRow('salons', s.id), wantStatus);
      if (p.followupDate) addAct(tx, me, s.id, { type: 'followup', note: p.followupNote || 'First follow-up', followupDate: p.followupDate });
    } else {
      delete s.status;
      if (s.assignedTo && lc(s.assignedTo) !== lc(ex.assignedTo)) addAct(tx, me, s.id, { type: 'note', note: 'Assigned to ' + s.assignedTo + (ex.assignedTo ? ' (was ' + ex.assignedTo + ')' : '') });
      put(tx, 'salons', s);
      if (wantStatus && wantStatus !== ex.status) changeStatus(tx, me, findRow('salons', s.id), wantStatus, p.statusReason);
    }
    refreshSalon(tx, s.id, { updatedAt: t });
    return tx;
  },

  deleteSalon: function (me, p) {
    needAdmin(me);
    var tx = newTx(), id = String(p.id);
    var oids = DB.all('orders').filter(function (o) { return String(o.salonId) === id; }).map(function (o) { return String(o.id); });
    drop(tx, 'items', function (r) { return oids.indexOf(String(r.orderId)) >= 0; });
    drop(tx, 'orders', function (r) { return String(r.salonId) === id; });
    drop(tx, 'samples', function (r) { return String(r.salonId) === id; });
    drop(tx, 'acts', function (r) { return String(r.salonId) === id; });
    drop(tx, 'salons', function (r) { return String(r.id) === id; });
    return tx;
  },

  /* type: visit | call | whatsapp | email | meeting | note | samples */
  logActivity: function (me, p) {
    var tx = newTx(), salon = findRow('salons', p.salonId);
    if (!salon) fail('Salon not found.');
    var type = p.type || 'note';
    var lines = (p.samples || []).filter(function (x) { return x && String(x.product || '').trim() && num(x.qty) > 0; });
    if (lines.length && type === 'note') type = 'samples';
    var act = addAct(tx, me, salon.id, { type: type, note: p.note || '', lat: p.lat || '', lng: p.lng || '', distance: p.distance === undefined || p.distance === null ? '' : p.distance });
    if (p.followupDate) addAct(tx, me, salon.id, { type: 'followup', note: p.followupNote || 'Follow up', followupDate: p.followupDate });
    lines.forEach(function (x) { put(tx, 'samples', { id: DB.uid(), salonId: salon.id, activityId: act.id, product: String(x.product).trim(), qty: num(x.qty), at: act.at, by: me.email }); });
    if (lines.length && (salon.status === 'Lead' || !salon.status)) changeStatus(tx, me, salon, 'Sampled');
    var patch = {};
    if (CONTACT_TYPES.indexOf(type) >= 0) patch.lastContact = act.at;
    if (p.savePin && p.lat && p.lng) { patch.lat = p.lat; patch.lng = p.lng; }
    refreshSalon(tx, salon.id, patch);
    return tx;
  },

  scheduleFollowup: function (me, p) {
    var tx = newTx();
    if (!findRow('salons', p.salonId)) fail('Salon not found.');
    if (!p.date) fail('Pick a date.');
    addAct(tx, me, p.salonId, { type: 'followup', note: p.note || 'Follow up', followupDate: p.date });
    refreshSalon(tx, p.salonId);
    return tx;
  },

  completeFollowup: function (me, p) {
    var tx = newTx(), fu = findRow('acts', p.id);
    if (!fu) fail('Follow-up not found.');
    var label = { call: 'Called', whatsapp: 'WhatsApp', visit: 'Visited', skip: 'Closed' }[p.outcomeType] || '';
    put(tx, 'acts', { id: fu.id, done: nowISO(), doneBy: me.email, outcome: (label ? label + (p.note ? ': ' : '') : '') + (p.note || '') });
    var patch = {};
    if (p.outcomeType && p.outcomeType !== 'skip') {
      var a = addAct(tx, me, fu.salonId, { type: p.outcomeType, note: p.note || '' });
      if (CONTACT_TYPES.indexOf(p.outcomeType) >= 0) patch.lastContact = a.at;
    }
    if (p.nextDate) addAct(tx, me, fu.salonId, { type: 'followup', note: p.nextNote || 'Follow up', followupDate: p.nextDate });
    if (p.status) { var s = findRow('salons', fu.salonId); if (s) changeStatus(tx, me, s, p.status, p.statusReason); if (p.status === 'Lost' && p.statusReason) patch.lostReason = p.statusReason; }
    refreshSalon(tx, fu.salonId, patch);
    return tx;
  },

  snoozeFollowup: function (me, p) {
    var tx = newTx(), fu = findRow('acts', p.id);
    if (!fu) fail('Follow-up not found.');
    if (!p.date) fail('Pick a date.');
    put(tx, 'acts', { id: fu.id, followupDate: p.date });
    refreshSalon(tx, fu.salonId);
    return tx;
  },

  deleteActivity: function (me, p) {
    var a = findRow('acts', p.id);
    if (!a) fail('Not found.');
    if (!isAdmin(me) && lc(a.by) !== me.email) fail('You can only delete your own entries.');
    var tx = newTx();
    drop(tx, 'samples', function (r) { return String(r.activityId) === String(a.id); });
    drop(tx, 'acts', function (r) { return String(r.id) === String(a.id); });
    refreshSalon(tx, a.salonId);
    return tx;
  },

  /* ---------- team ---------- */
  saveUser: function (me, p) {
    needAdmin(me);
    var u = p.user || {}, email = lc(u.email), ex = findRow('users', email), isNew = !ex;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) fail('Enter a valid email.');
    if (!String(u.name || '').trim()) fail('Enter a name.');
    if (isNew && p.isNew === false) fail('User not found.');
    if (!isNew && p.isNew) fail('Someone with this email already exists.');
    var pin = String(u.pin === undefined || u.pin === null ? '' : u.pin).trim();
    if (pin && !/^[1-9][0-9]{3,5}$/.test(pin)) fail('PIN must be 4 to 6 digits and not start with 0.');
    if (isNew && !pin) fail('Give the new person a PIN.');
    var role = u.role === 'admin' ? 'admin' : 'user', active = u.active === 'no' ? 'no' : 'yes';
    if (!isNew && email === me.email && (role !== 'admin' || active === 'no')) {
      var admins = DB.all('users').filter(function (x) { return lc(x.email) !== me.email && lc(x.role) === 'admin' && userActive(x); });
      if (!admins.length) fail('You are the only admin. Make someone else admin first.');
    }
    var row = { email: email, name: String(u.name).trim(), role: role, active: active, phone: u.phone || '' };
    if (pin) row.pin = pin;
    var tx = newTx();
    var saved = put(tx, 'users', row);
    tx.upsert.team = [teamUser(saved)];
    var pu = pubUser(saved); pu.active = active;
    tx.upsert.users = [pu];
    return tx;
  },

  changePin: function (me, p) {
    var u = findRow('users', me.email);
    if (!u) fail('User not found.');
    if (String(u.pin).trim() !== String(p.oldPin || '').trim()) fail('Your current PIN is not correct.');
    var pin = String(p.newPin || '').trim();
    if (!/^[1-9][0-9]{3,5}$/.test(pin)) fail('New PIN must be 4 to 6 digits and not start with 0.');
    var tx = newTx();
    DB.upsert('users', { email: lc(u.email), pin: pin });
    return tx;
  }
};

/* ============================================================
 * Sales orders. Invoices are made in Zoho Books.
 * Draft -> Submitted -> Invoiced -> Delivered, or Cancelled
 * ============================================================ */
var ORDER_FLOW = ['Draft', 'Submitted', 'Invoiced', 'Delivered'];
function nextOrderNo(S) {
  var pre = S.orderPrefix || 'SO-', max = 0;
  DB.all('orders').forEach(function (o) { var n = String(o.orderNo || ''); if (n.indexOf(pre) === 0) { var v = parseInt(n.slice(pre.length), 10); if (!isNaN(v) && v > max) max = v; } });
  var next = String(max + 1); while (next.length < 4) next = '0' + next;
  return pre + next;
}
function orderLabel(o) { return o.orderNo || 'Draft order'; }
function afterOrderStatus(tx, me, o, prev, S, extra) {
  extra = extra || {};
  if (prev === o.status) return;
  var t = nowISO(), patch = { id: o.id, updatedAt: t };
  var money = num(o.total) ? ', AED ' + num(o.total).toFixed(2) : '';
  if (o.status !== 'Draft' && o.status !== 'Cancelled' && !o.orderNo) { o.orderNo = nextOrderNo(S); patch.orderNo = o.orderNo; }
  if (ORDER_FLOW.indexOf(o.status) >= 1 && !o.submittedAt) { patch.submittedAt = t; patch.submittedBy = me.email; }
  if (o.status === 'Invoiced' || o.status === 'Delivered') { if (!o.invoicedAt) { patch.invoicedAt = t; patch.invoicedBy = me.email; } if (extra.zohoInvoice) patch.zohoInvoice = extra.zohoInvoice; }
  if (o.status === 'Delivered' && !o.deliveredAt) { patch.deliveredAt = t; patch.deliveredBy = me.email; }
  if (o.status === 'Cancelled') { patch.cancelledAt = t; patch.cancelReason = extra.reason || ''; }
  put(tx, 'orders', patch);
  var lbl = o.orderNo || 'Draft order';
  if (ORDER_FLOW.indexOf(prev) < 1 && ORDER_FLOW.indexOf(o.status) >= 1) {
    addAct(tx, me, o.salonId, { type: 'order', note: lbl + ' submitted, ' + num(o.units) + ' units' + money + (o.deliveryDate ? '. Delivery ' + o.deliveryDate + (o.deliverySlot ? ' ' + o.deliverySlot : '') : '') });
    var salon = findRow('salons', o.salonId);
    if (salon && salon.status !== 'Customer') changeStatus(tx, me, salon, 'Customer', 'Order ' + lbl);
    DB.all('acts').filter(function (a) { return String(a.salonId) === String(o.salonId) && isOpenFu(a) && /^Reorder check/i.test(String(a.note || '')); })
      .forEach(function (a) { put(tx, 'acts', { id: a.id, done: nowISO(), doneBy: me.email, outcome: 'Ordered: ' + lbl }); });
    var hasOpen = DB.all('acts').some(function (a) { return String(a.salonId) === String(o.salonId) && isOpenFu(a); });
    if (!hasOpen) addAct(tx, me, o.salonId, { type: 'followup', note: 'Reorder check after ' + lbl, followupDate: addDays(o.deliveryDate || todayStr(), cadenceFor('Customer', S)) });
    if (o.status === 'Submitted' && typeof ZOHO_HOOK === 'function' && isTrue(S.zohoAutoInvoice)) ZOHO_HOOK(tx, me, findRow('orders', o.id), S);
  }
  if (o.status === 'Invoiced' && prev !== 'Invoiced') addAct(tx, me, o.salonId, { type: 'order', note: lbl + ' invoiced in Zoho' + (patch.zohoInvoice || o.zohoInvoice ? ' (' + (patch.zohoInvoice || o.zohoInvoice) + ')' : '') });
  if (o.status === 'Delivered') addAct(tx, me, o.salonId, { type: 'delivery', note: lbl + ' delivered' });
  if (o.status === 'Cancelled') addAct(tx, me, o.salonId, { type: 'order', note: lbl + ' cancelled' + (extra.reason ? ': ' + extra.reason : '') });
  refreshSalon(tx, o.salonId);
}
API.saveOrder = function (me, p) {
  var tx = newTx(), S = S_(), o = pick(p.order || {}, TABLES.orders.head), t = nowISO();
  var salon = findRow('salons', o.salonId);
  if (!salon) fail('Pick a salon for this order.');
  var lines = (p.items || []).filter(function (i) { return i && String(i.product || '').trim() && num(i.qty) > 0; });
  if (!lines.length) fail('Add at least one product.');
  var ex = o.id ? findRow('orders', o.id) : null;
  if (o.id && !ex) fail('Order not found.');
  if (ex && ['Invoiced', 'Delivered', 'Cancelled'].indexOf(ex.status) >= 0 && !isAdmin(me)) fail('This order is ' + ex.status.toLowerCase() + '. Ask an admin to change it.');
  var prev = ex ? ex.status : '';
  ['orderNo', 'createdAt', 'createdBy', 'submittedAt', 'submittedBy', 'invoicedAt', 'invoicedBy', 'deliveredAt', 'deliveredBy', 'cancelledAt', 'zohoInvoiceId', 'zohoStatus', 'zohoBalance', 'zohoTotal', 'zohoError', 'zohoSyncedAt', 'zohoInvoice'].forEach(function (k) { delete o[k]; });
  if (!ex) { o.id = DB.uid(); o.createdAt = t; o.createdBy = me.email; }

  const newS = S.salons.filter(s => localDate(s.createdAt).slice(0, 7) === mo).length;
  const sampled = new Set(S.samples.map(x => x.salonId)), cust = S.salons.filter(s => s.status === 'Customer');
  const conv = sampled.size ? Math.round(cust.filter(s => sampled.has(s.id)).length / sampled.size * 100) : 0;

  const total = S.salons.length || 1;

  <div class="hello"><h1>${greet()}, ${esc(first(S.me.name))}</h1><p class="muted">${fmtD(t, true)}${DEMO ? ' <span class="pill wine">Demo data</span>' : ''}</p></div>
  <button class="focus" data-a="tab" data-id="followups"><div class="n">${due.length}</div><div class="x">${due.length === 1 ? 'follow-up needs you today' : 'follow-ups need you today'}${late.length ? `<br><b>${late.length} overdue</b>` : due.length ? '' : '<br>You are all caught up'}</div></button>
  <div class="block"><div class="stats">
    <div class="stat"><div class="v">${visitsWk}</div><div class="l">Visits in the last 7 days</div></div>
    <div class="stat"><div class="v">${samp}</div><div class="l">Samples given this month</div></div>
    <div class="stat"><div class="v">${S.orders.filter(o => liveOrd(o) && localDate(o.submittedAt || o.orderDate).slice(0, 7) === mo).length}</div><div class="l">Orders this month</div></div>
    <div class="stat"><div class="v">${cust.length} <span style="font-size:15px;font-weight:600" class="muted">${conv}%</span></div><div class="l">Customers, % of sampled</div></div>
  </div></div>

  ${upcomingDeliveries()}

  ${due.length ? `<div class="sec"><h2>Due now</h2><button class="link" data-a="tab" data-id="followups">See all</button></div><div class="block">${due.slice(0, 6).map(fuRow).join('')}</div>` : ''}

  </div>`;
}
function repStats(email, from, to) {
  const inR = d => { d = localDate(d); return d >= from && d <= to; };
  const acts = S.acts.filter(a => lc(a.by) === email && inR(a.at));
  return {
    visits: acts.filter(a => typeOf(a) === 'visit').length,
    talks: acts.filter(a => ['call', 'whatsapp', 'email', 'meeting'].includes(typeOf(a))).length,
    samples: S.samples.filter(x => lc(x.by) === email && inR(x.at)).reduce((t, x) => t + num(x.qty), 0),
    added: S.salons.filter(s => lc(s.createdBy) === email && inR(s.createdAt)).length,
    won: acts.filter(a => typeOf(a) === 'status' && /→\s*Customer/.test(a.note)).length,
    orders: S.orders.filter(o => liveOrd(o) && lc(o.submittedBy || o.createdBy) === email && inR(o.submittedAt || o.orderDate)).length,
    fu: acts.filter(a => a.followupDate && isDone(a)).length + S.acts.filter(a => a.followupDate && isDone(a) && lc(a.doneBy) === email && inR(a.done)).length
  };
}
function teamBlock(mo) {

  const rows = users.map(u => Object.assign({ u }, repStats(u.email, from, to))).sort((a, b) => (b.visits + b.talks + b.samples) - (a.visits + a.talks + a.samples));
  return `<div class="sec"><h2>Team this month</h2></div><div class="block"><div class="lb"><div class="lh"><span></span><span>Visits</span><span>Calls</span><span>Samples</span><span>Orders</span></div>

}
function fuRow(a) {

/* rich history entry */
const TYPE = {

function dayLabel(d) { const n = daysBetween(d, today()); return n === 0 ? 'Today' : n === 1 ? 'Yesterday' : fmtD(d, d.slice(0, 4) !== today().slice(0, 4)); }

function histItem(a, withSalon) {

  if (t === 'visit') {
    if (a.distance !== '' && a.distance !== undefined && a.distance !== null) { const d = num(a.distance); extra += d <= R ? `<span class="pill ok">${ic('check', 'sm')}At the salon, ${d} m</span>` : `<span class="pill warn">${d} m from the salon pin</span>`; }

  let fu = '';
  if (a.followupDate) {
    if (isDone(a)) fu = `<div class="fuline done">${ic('check', 'sm')}<div><b>Done</b> ${fmtD(a.done)}${a.doneBy ? ' by ' + esc(first(uName(a.doneBy))) : ''}${t === 'followup' ? ', was due ' + fmtD(a.followupDate) : ''}${a.outcome ? `<div>${esc(a.outcome)}</div>` : ''}</div></div>`;
    else { const b = fuBucket(a); fu = `<div class="fuline ${b}">${ic('cal', 'sm')}<div><b>${t === 'followup' ? 'Due' : 'Follow-up due'} ${rel(a.followupDate).toLowerCase()}</b>, ${fmtD(a.followupDate)}</div><button class="btn sm" data-a="fuOpen" data-id="${a.id}">Done</button></div>`; }
  }
  const map = a.lat && a.lng ? `<a class="tiny" href="https://www.google.com/maps?q=${esc(a.lat)},${esc(a.lng)}" target="_blank" rel="noopener">${ic('pin', 'sm')}Map</a>` : '';

function salonList() {
  const q = ui.q.trim().toLowerCase();
  let l = S.salons.filter(s => (ui.status === 'All' || (s.status || 'Lead') === ui.status) && (ui.emirate === 'All' || s.emirate === ui.emirate) && (!ui.mine || lc(s.assignedTo) === S.me.email) &&
    (!q || [s.name, s.area, s.emirate, s.owner, s.phone, s.whatsapp, s.instagram, s.tags, s.decisionMaker].join(' ').toLowerCase().includes(q)));
  const by = {
    next: (a, b) => (a.nextFollowup || '9999').localeCompare(b.nextFollowup || '9999'),
    recent: (a, b) => String(b.lastContact || '').localeCompare(String(a.lastContact || '')),
    stale: (a, b) => String(a.lastContact || '').localeCompare(String(b.lastContact || '')),
    new: (a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')), name: (a, b) => String(a.name).localeCompare(String(b.name)),

const actBtn = (a, i, l) => `<button class="act" data-a="${a}" data-id="${view().id}">${ic(i)}${l}</button>`;
const HFILTERS = [['all', 'All'], ['visit', 'Visits'], ['call', 'Calls'], ['whatsapp', 'WhatsApp'], ['samples', 'Samples'], ['note', 'Notes'], ['followup', 'Follow-ups'], ['order', 'Orders'], ['status', 'Status']];
function salonHistory(s) {

/* SAMPLES */
function vSamples(v) {
  const t = today();
  const from = { month: t.slice(0, 7) + '-01', q: addDays(t, -90), all: '0000' }[ui.sPeriod];
  const sm = S.samples.filter(x => localDate(x.at) >= from && X.salon[x.salonId]);
  const by = {};
  sm.forEach(x => { by[x.product] = by[x.product] || { q: 0, salons: new Set() }; by[x.product].q += num(x.qty); by[x.product].salons.add(x.salonId); });
  const won = id => (X.salon[id] || {}).status === 'Customer';
  const rows = Object.entries(by).sort((a, b) => b[1].q - a[1].q);
  const salons = new Set(sm.map(x => x.salonId)), wonN = [...salons].filter(won).length;
  const max = rows.length ? rows[0][1].q : 1;
  const drops = S.acts.filter(a => (X.samplesByAct[a.id] || []).length && localDate(a.at) >= from && X.salon[a.salonId]).sort((a, b) => String(b.at).localeCompare(String(a.at))).slice(0, 15);
  return `${topbar('Samples report')}<div class="wrap" style="padding-top:0">
  <div class="seg">${[['month', 'This month'], ['q', 'Last 90 days'], ['all', 'All time']].map(([k, l]) => `<button class="${ui.sPeriod === k ? 'on' : ''}" data-a="sPeriod" data-id="${k}">${l}</button>`).join('')}</div>
  <div class="block"><div class="stats" style="grid-template-columns:1fr 1fr 1fr">
    <div class="stat"><div class="v">${sm.reduce((a, x) => a + num(x.qty), 0)}</div><div class="l">Units given</div></div>
    <div class="stat"><div class="v">${salons.size}</div><div class="l">Salons sampled</div></div>
    <div class="stat"><div class="v">${salons.size ? Math.round(wonN / salons.size * 100) : 0}%</div><div class="l">Became customers</div></div></div></div>
  <div class="sec"><h2>By product</h2></div>
  <div class="block">${rows.map(([p, d]) => { const w = [...d.salons].filter(won).length; return `<div class="row" style="cursor:default;display:block"><div style="display:flex;justify-content:space-between;gap:10px"><span class="t" style="font-weight:600">${esc(p)}</span><span class="small" style="white-space:nowrap"><b>${d.q}</b> units</span></div><div class="bar2"><span style="width:${d.q / max * 100}%"></span></div><div class="s" style="margin-top:4px">${d.salons.size} salon${d.salons.size === 1 ? '' : 's'}, ${w} became customer${w === 1 ? '' : 's'} (${Math.round(w / d.salons.size * 100)}%)</div></div>`; }).join('') || '<div class="empty"><b>No samples in this period</b></div>'}</div>

  <div class="chips">${Object.keys(F).map(k => `<button class="chip ${ui.oFilter === k ? 'on' : ''}" data-a="oFilter" data-id="${k}">${F[k][0]}${k === 'all' ? '' : ' ' + cnt(k)}</button>`).join('')}</div>

/* share texts */
function orderText(o, forSalon) {
  const s = X.salon[o.salonId] || {}, items = X.items[o.id] || [], sm = showMoney() && num(o.subtotal);
  const L = forSalon
    ? [`Hi ${first(s.owner) || 'there'}, thank you for your order with ${S.settings.businessName}!`, '', `*Order ${oName(o)}*`]
    : [`*New order ${oName(o)}*`, `Salon: ${s.name || ''}`, `Taken by: ${uName(o.createdBy)}`];
  L.push('');
  items.forEach(i => L.push(`${i.qty} × ${i.product}${sm && num(i.price) ? ' = ' + money(i.lineTotal) : ''}`));
  L.push(`Units: ${num(o.units)}`);
  if (sm) { if (num(o.discount)) L.push(`Discount ${num(o.discountPct)}%: −${money(o.discount)}`); L.push(`Delivery: ${num(o.delivery) ? money(o.delivery) : 'Free'}`); if (num(o.vatRate)) L.push(`VAT: ${money(o.vat)}`); L.push(`*Estimated total: ${money(o.total)}*`); }

/* REORDER RADAR */
function radar() {
  const t = today(), cad = num(S.settings.cadenceCustomer) || 30;
  return S.salons.filter(s => s.status !== 'Lost').map(s => {
    const all = X.orders[s.id] || [];
    if (all.some(o => o.status === 'Submitted' || o.status === 'Invoiced')) return null;
    const live = all.filter(liveOrd); if (!live.length) return null;
    const ds = live.map(o => localDate(o.deliveredAt || o.deliveryDate || o.orderDate)).sort();
    const gaps = []; for (let i = 1; i < ds.length; i++) { const g = daysBetween(ds[i - 1], ds[i]); if (g >= 5) gaps.push(g); }
    const every = gaps.length ? Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length) : cad;
    const last = ds[ds.length - 1], since = daysBetween(last, t);
    return { s, every, learned: gaps.length, last, since, left: every - since, lastOrder: live[0], units: Math.round(live.reduce((a, o) => a + num(o.units), 0) / live.length) };
  }).filter(Boolean).sort((a, b) => a.left - b.left);
}

/* PLAN MY DAY */
function planCandidates() {
  const t = today(), rad = {}; radar().forEach(r => rad[r.s.id] = r);
  return S.salons.filter(s => s.status !== 'Lost').map(s => {
    const why = []; let score = 0;
    const fu = (X.acts[s.id] || []).filter(isOpenFu).sort((a, b) => String(a.followupDate).localeCompare(String(b.followupDate)))[0];
    if (fu && localDate(fu.followupDate) <= t) { score += 100; why.push(fuBucket(fu) === 'late' ? 'Follow-up overdue' : 'Follow-up today'); }
    else if (fu && localDate(fu.followupDate) <= addDays(t, 2)) { score += 30; why.push('Follow-up ' + rel(fu.followupDate).toLowerCase()); }
    const r = rad[s.id]; if (r && r.left <= 3) { score += 90; why.push(r.left < 0 ? 'Reorder ' + (-r.left) + ' days late' : 'Reorder due'); }
    const since = s.lastContact ? daysBetween(s.lastContact, t) : null;
    if (s.priority === 'Hot') { score += 50; why.push('Hot'); } else if (s.priority === 'Warm') { score += 25; }
    if (s.status === 'Sampled' && since !== null && since >= 7) { score += 40; why.push('Sampled, no news for ' + since + ' days'); }
    if ((s.status || 'Lead') === 'Lead' && !(X.acts[s.id] || []).some(a => typeOf(a) === 'visit')) { score += 30; why.push('Never visited'); }
    if (since !== null && since >= 21 && s.status !== 'Customer') { score += 15; why.push('Quiet for ' + since + ' days'); }
    if (!why.length) return null;
    return { s, score, why, d: distTo(s) };
  }).filter(Boolean);
}
