<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6F8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#171114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="JOIA Sales">
<title>JOIA Sales, The Beauty Lab</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6F8;--surface:#FFFFFF;--sunk:#F4E9EE;--ink:#2E2A33;--muted:#6B6772;--line:#F1DDE2;
  --wine:#B0426F;--wine-soft:#FCE8EF;--on-wine:#FFFFFF;
  --ok:#2E7452;--warn:#A86412;--bad:#B42318;--ok-soft:#E3F1EA;--warn-soft:#FAEEDC;--bad-soft:#FBE6E3;
  --s-lead:#8A7CB2;--s-sampled:#C9668F;--s-follow:#D08A2C;--s-customer:#2E7452;--s-lost:#A09AA2;
  --shadow:0 1px 0 rgba(36,26,38,.04),0 8px 24px -12px rgba(36,26,38,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171114;--surface:#221A1F;--sunk:#2C2228;--ink:#F6EEF1;--muted:#B8AEB5;--line:#3E3038;
  --wine:#E883AC;--wine-soft:#3E2230;--on-wine:#1A1016;
  --ok:#6CC69A;--warn:#E5A955;--bad:#F07B6E;--ok-soft:#1E3329;--warn-soft:#3A2B17;--bad-soft:#3D1D1A;
  --s-lead:#A99BD3;--s-sampled:#E58AB0;--s-follow:#E8A64E;--s-customer:#6CC69A;--s-lost:#8C858E;
  --shadow:0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#171114;--surface:#221A1F;--sunk:#2C2228;--ink:#F6EEF1;--muted:#B8AEB5;--line:#3E3038;
  --wine:#E883AC;--wine-soft:#3E2230;--on-wine:#1A1016;
  --ok:#6CC69A;--warn:#E5A955;--bad:#F07B6E;--ok-soft:#1E3329;--warn-soft:#3A2B17;--bad-soft:#3D1D1A;
  --s-lead:#A99BD3;--s-sampled:#E58AB0;--s-follow:#E8A64E;--s-customer:#6CC69A;--s-lost:#8C858E;
  --shadow:0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 "Urbanist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Urbanist",system-ui,sans-serif;letter-spacing:-.01em;margin:0}
h1{font-size:30px;line-height:1.1;font-weight:700}
h2{font-size:19px;font-weight:650}
h3{font-size:16px;font-weight:650}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--wine)}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12px}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 120px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 12px;max-width:720px;margin:0 auto}
.topbar .title{flex:1;font-weight:650;font-family:"Urbanist",system-ui,sans-serif;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib:active{background:var(--sunk)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hello{padding:8px 0 18px}
.hello p{margin:6px 0 0}
/* swatch: the signature element, a glossy gel cap */
.sw{--c:var(--s-lead);width:14px;height:14px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 14%,transparent 34%),var(--c);box-shadow:inset 0 -2px 3px rgba(0,0,0,.18)}
.sw.big{width:58px;height:58px;box-shadow:inset 0 -6px 10px rgba(0,0,0,.2),0 6px 18px -6px var(--c)}
.sw[data-s="Sampled"]{--c:var(--s-sampled)} .sw[data-s="Follow-up"]{--c:var(--s-follow)} .sw[data-s="Customer"]{--c:var(--s-customer)} .sw[data-s="Lost"]{--c:var(--s-lost)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:600;white-space:nowrap;border:0}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.wine{background:var(--wine-soft);color:var(--wine)}
.block{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin:10px 0 22px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px}
.sec a,.link{font-size:14px;font-weight:600;color:var(--wine);background:none;border:0;cursor:pointer;padding:4px}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:active{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex:none}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.stat{background:var(--surface);padding:14px 16px}
.stat .v{font-family:"Urbanist",system-ui,sans-serif;font-size:22px;font-weight:700;line-height:1.15}
.stat .l{font-size:13px;color:var(--muted)}
.focus{display:flex;align-items:center;gap:14px;padding:18px;background:var(--wine);color:var(--on-wine);border-radius:20px;margin:4px 0 22px;border:0;width:100%;text-align:left;cursor:pointer}
.focus .n{font-family:"Urbanist",system-ui,sans-serif;font-size:44px;font-weight:700;line-height:1}
.focus .x{font-size:15px;opacity:.92}
.pipe{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:14px 16px 6px;background:var(--sunk)}
.pipe span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 16px 14px}
.legend button{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;font-size:14px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:0 12px;box-shadow:var(--shadow);margin:4px 0 12px}
.search input{border:0;background:transparent;padding:13px 0;flex:1;outline:none;min-width:0}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;margin:6px 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hero{display:flex;gap:16px;align-items:center;padding:6px 0 16px}
.hero h1{font-size:26px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:16px;background:var(--surface);border:0;box-shadow:var(--shadow);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.act svg.i{color:var(--wine)}
.act:active{transform:scale(.97)}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin:0 0 14px}
.card.due{border-left:5px solid var(--warn)} .card.late{border-left:5px solid var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;padding:14px 16px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;word-break:break-word}
.tl{padding:6px 16px 8px}
.tl .it{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tl .it:first-child{border-top:0}
.tl .dot{width:32px;height:32px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--wine)}
.tl .dot svg.i{width:17px;height:17px}
.tl .body{flex:1;min-width:0}
.tl .body p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:650;cursor:pointer;background:var(--wine);color:var(--on-wine);font-size:16px}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.line{background:transparent;color:var(--wine);box-shadow:inset 0 0 0 1.5px var(--wine)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
.btn.block{display:flex;width:100%;box-shadow:none;margin:0}
.btn[disabled]{opacity:.5;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 10px 24px -8px rgba(123,30,58,.6);border-radius:18px;padding:14px 18px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{display:flex;max-width:720px;margin:0 auto}
.tabbar button{flex:1;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabbar button.on{color:var(--wine)}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;padding:1px 6px;font-weight:700}
/* forms */
.f{display:block;margin:0 0 14px}
.f>span{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin:0 0 6px}
.f input,.f select,.f textarea,.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 13px;font-size:16px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{border-color:var(--wine)}
.f textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fs{margin:6px 0 4px;font-weight:650;font-family:"Urbanist",system-ui,sans-serif;font-size:16px;padding-top:10px;border-top:1px solid var(--line)}
.fs:first-child{border-top:0;padding-top:0}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,18,.45);z-index:40;animation:fade .18s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:24px 24px 0 0;max-height:calc(100% - 40px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:14px 12px 8px 20px}
.sheet .sh h2{flex:1}
.sheet .sb{overflow:auto;padding:6px 20px 16px;-webkit-overflow-scrolling:touch}
.sheet .sf{padding:10px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14.5px;box-shadow:var(--shadow);animation:fade .2s;max-width:86vw}
#toast div.bad{background:var(--bad);color:#fff}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;z-index:70;background:linear-gradient(90deg,transparent,var(--wine),transparent);background-size:50% 100%;animation:slide 1s linear infinite;display:none}
#bar.on{display:block}
@keyframes slide{from{background-position:-50% 0}to{background-position:150% 0}}
/* order editor */
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .nm{flex:1;min-width:0;font-weight:600;font-size:15px}
.step{display:flex;align-items:center;background:var(--sunk);border-radius:11px}
.step button{width:34px;height:34px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--ink)}
.step input{width:46px;text-align:center;border:0;background:transparent;padding:6px 0;font-weight:700;outline:none;-moz-appearance:textfield}
.price{width:78px;border:1px solid var(--line);border-radius:10px;padding:7px 8px;text-align:right;background:var(--surface)}
.tot{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
.tot>span:nth-child(even){text-align:right;white-space:nowrap}
.tot .big{font-family:"Urbanist",system-ui,sans-serif;font-weight:700;font-size:22px;padding-top:6px;border-top:1px solid var(--line)}
.results{max-height:240px;overflow:auto;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);margin:-4px 0 14px}
.results .row{padding:10px 14px}
.steps{display:flex;gap:4px;margin:4px 0 16px}
.steps div{flex:1;height:6px;border-radius:9px;background:var(--sunk)}
.steps div.on{background:var(--wine)}
.warnbox{background:var(--warn-soft);color:var(--warn);padding:10px 13px;border-radius:12px;font-size:14px;font-weight:600;margin:8px 0}
/* invoice */
.inv{background:#fff;color:#1d141f;border-radius:6px;padding:28px 24px;box-shadow:var(--shadow);font-size:14px;line-height:1.45}
.inv h1{font-size:24px;color:#7B1E3A}
.inv table{width:100%;border-collapse:collapse;margin:18px 0}
.inv th{text-align:left;font-size:12px;color:#6d6270;border-bottom:1.5px solid #1d141f;padding:6px 4px;font-weight:600}
.inv td{padding:8px 4px;border-bottom:1px solid #e8e2e9;vertical-align:top}
.inv .r{text-align:right;white-space:nowrap}
.inv .meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px}
.inv .sum{margin-left:auto;max-width:300px;display:grid;grid-template-columns:1fr auto;gap:4px 18px}
.inv .sum .g{font-weight:700;font-size:17px;border-top:1.5px solid #1d141f;padding-top:6px}
.login{max-width:400px;margin:0 auto;padding:12vh 24px 40px}
.login .brand{width:88px;height:88px;border-radius:24px;background:linear-gradient(135deg,#C95C8A,#92345E);display:grid;place-items:center;margin-bottom:22px;box-shadow:0 14px 30px -14px rgba(146,52,94,.6)}
.login .brand img{width:66px;height:auto}
.card.alert{display:block;width:100%;border:1px solid var(--line);cursor:pointer;color:var(--ink);font:inherit;background:var(--surface)}
.card.alert svg.i{color:var(--bad)} svg.flip{transform:rotate(180deg)} svg.inl{width:15px;height:15px;vertical-align:-3px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.qbtn svg.i{color:var(--wine);margin-bottom:6px}.qbtn b{font-size:15px}.qbtn span{font-size:12.5px;color:var(--muted)}
.pill.qty{font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
.stockbig{display:flex;align-items:center;gap:16px}
.stockbig .n{font-size:40px;font-weight:800;line-height:1;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.stockbig.ok .n{color:var(--ok)}.stockbig.warn .n{color:var(--warn)}.stockbig.bad .n{color:var(--bad)}.stockbig .n{color:var(--muted)}
.stockbig.ok .n,.stockbig.warn .n,.stockbig.bad .n{}
.actions.three{grid-template-columns:repeat(3,1fr)}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.crow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}.crow .main{flex:1;min-width:0}.crow .t{font-weight:600}.crow .s{font-size:13px;color:var(--muted)}
.crow input{width:84px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--sunk);text-align:center;font-size:17px;font-weight:600}
.crow input:focus{border-color:var(--wine);outline:none;background:var(--surface)}
.crow input::placeholder{color:var(--muted);opacity:.4;font-weight:500}
.crow input:not(:placeholder-shown){border-color:var(--wine);background:var(--wine-soft);color:var(--wine)}
.stickyb{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:14px}
.pickc{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);cursor:pointer;font:inherit;color:var(--ink);background:var(--surface);margin-bottom:12px}
.av{width:40px;height:40px;border-radius:12px;background:var(--wine-soft);color:var(--wine);display:grid;place-items:center;font-weight:700;flex:none}
.tog{display:flex;gap:10px;align-items:center;margin:4px 0 14px}.tog input{width:20px;height:20px;accent-color:var(--wine)}
a.btn{text-decoration:none}
.msg{white-space:pre-wrap;background:var(--sunk);border-radius:12px;padding:14px;font-size:14px;user-select:text;-webkit-user-select:text}
.login h1{font-size:34px;margin-bottom:6px}
.bar2{height:8px;border-radius:9px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar2 span{display:block;height:100%;background:var(--wine);border-radius:9px}
@media print{
  body{background:#fff}.topbar,.tabbar,.fab,#toast,.noprint,body::before{display:none!important}
  .wrap{padding:0;max-width:none}.inv{box-shadow:none;padding:0}
  :root{padding:0}
}

svg.i.sm{width:15px;height:15px;vertical-align:-3px}
.hist{padding:2px 14px 6px}
.day{font-size:13px;font-weight:700;color:var(--muted);padding:14px 2px 4px}
.hi{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.day+.hi,.hist>.hi:first-child{border-top:0}
.hi .dot{width:34px;height:34px;border-radius:11px;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--wine)}
.hi .dot svg.i{width:17px;height:17px}
.hi.t-visit .dot{background:var(--ok-soft);color:var(--ok)}
.hi.t-samples .dot{background:var(--wine-soft);color:var(--wine)}
.hi.t-followup .dot{background:var(--warn-soft);color:var(--warn)}
.hi.t-status .dot{background:var(--ink);color:var(--bg)}
.hi .body{flex:1;min-width:0}
.hi .hm{font-size:13px;color:var(--muted);margin-top:2px;display:flex;align-items:center;flex-wrap:wrap;gap:2px 6px}
.hi .hm a{display:inline-flex;align-items:center;gap:3px;text-decoration:none;font-weight:600}
.hi p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;font-size:15px}
.hx{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.hx .pill{font-weight:500;white-space:normal}
.fuline{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--sunk);font-size:14px}
.fuline>div{flex:1}
.fuline.late{background:var(--bad-soft);color:var(--bad)} .fuline.today{background:var(--warn-soft);color:var(--warn)}
.fuline.done{background:var(--ok-soft);color:var(--ok)} .fuline.done div div{color:var(--ink);margin-top:2px}
.lb{padding:4px 16px 10px}
.lh,.lr{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px 58px 40px;align-items:center;gap:4px;text-align:center}
.lh{font-size:12px;color:var(--muted);padding:8px 0 4px}
.lr{padding:9px 0;border-top:1px solid var(--line)}
.lr .nm{text-align:left;font-weight:600;display:flex;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.otl{padding:8px 16px}
.ost{display:flex;gap:12px;align-items:flex-start;padding:8px 0;position:relative}
.ost>span{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:5px;flex:none}
.ost.on>span{background:var(--wine);border-color:var(--wine)}
.ost:not(:last-child)::after{content:"";position:absolute;left:5px;top:22px;bottom:-6px;width:2px;background:var(--line)}
.net{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;display:flex;align-items:center;gap:8px;justify-content:center;padding:8px 14px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600}
.net.sync{background:var(--wine-soft);color:var(--wine)}
.tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;cursor:pointer;color:var(--on-wine);padding:0}
.tick.on{background:var(--wine);border-color:var(--wine)}
.tick[disabled]{opacity:.35}
.tick svg.i{width:18px;height:18px}
.planbar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;background:var(--surface);padding:10px 12px 10px 16px;border-radius:18px;box-shadow:0 10px 30px -10px rgba(36,26,38,.35);margin-top:8px}
.planbar>span{flex:1}
.tg{margin:4px 0 10px}
.tgh{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px}
.tgrid .f input{padding:10px}
.chk{display:flex;gap:10px;align-items:center;margin:-6px 0 14px;font-size:14.5px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--wine)}
.hm .av,.lr .av,.pill .av{display:inline-grid;place-items:center;border-radius:50%;background:var(--wine-soft);color:var(--wine);font-weight:700;flex:none;vertical-align:middle}
.tabbar.six button{font-size:10.5px;padding-left:0;padding-right:0}
.tabbar.six svg.i{width:21px;height:21px}

<body>
<div id="bar"></div><div id="app"></div><div id="sheet-root"></div><div id="toast" aria-live="polite"></div>
<script>
/* ============================================================
 * JOIA Sales by The Beauty Lab · shared core v3
 * The same code runs on the server (Code.gs) and in the app demo.
 * ============================================================ */
var APP_VERSION = '3.0';
var STATUSES = ['Lead', 'Sampled', 'Follow-up', 'Customer', 'Lost'];
var CONTACT_TYPES = ['visit', 'call', 'whatsapp', 'email', 'sample', 'samples', 'meeting'];
var STOCK_REASONS = { receive: 'Received', salon: 'Salon order', sample: 'Sample', web: 'Website order', count: 'Stock count', damage: 'Damaged or lost', correction: 'Correction', undo: 'Undone', returned: 'Returned' };

var TABLES = {
  salons: { sheet: 'Salons', key: 'id', head: ['id','name','owner','phone','whatsapp','instagram','email','emirate','area','address','lat','lng','mapsUrl','status','assignedTo','source','notes','createdAt','createdBy','updatedAt','lastContact','nextFollowup',
    'priority','decisionMaker','decisionRole','chairs','staff','brandsUsed','priceTier','hours','tags','lostReason'] },
  acts: { sheet: 'Activities', key: 'id', head: ['id','salonId','type','note','lat','lng','distance','at','by','followupDate','done','outcome'] },
  samples: { sheet: 'Samples', key: 'id', head: ['id','salonId','activityId','product','qty','at','by','sku'] },
  products: { sheet: 'Products', key: 'sku', head: ['sku','code','name','category','size','price','active','stock','lowAt','updatedAt'] },
  moves: { sheet: 'StockMoves', key: 'id', head: ['id','sku','product','change','balance','reason','ref','salonId','note','at','by'] },
  settings: { sheet: 'Settings', key: 'key', head: ['key','value','help'] },
  users: { sheet: 'Users', key: 'email', head: ['email','name','role','pin','active'] }
};

var DEFAULT_SETTINGS = [
  ['businessName', 'The Beauty Lab', 'Your business name in WhatsApp messages'],
  ['minOrder', '500', 'Salon minimum order (AED), used in the price list message'],
  ['tier1Amount', '2000', 'Discount tier 1 from (AED)'],
  ['tier1Pct', '10', 'Tier 1 discount %'],
  ['tier2Amount', '5000', 'Discount tier 2 from (AED)'],
  ['tier2Pct', '15', 'Tier 2 discount %'],
  ['deliveryFee', '35', 'Delivery fee (AED)'],
  ['lowStock', '3', 'Warn when stock is at or below this, unless a product has its own level'],
  ['appUrl', '', 'Link to the installed app, used in login messages to the team'],
  ['catalogUrl', 'https://beautylabuae.com/products.json', 'Website product list used by Sync with website'],
  ['cadenceLead', '3', 'Days to next follow-up for a Lead'],
  ['cadenceSampled', '7', 'Days to next follow-up after samples'],
  ['cadenceFollowup', '5', 'Days to next follow-up for Follow-up status'],
  ['cadenceCustomer', '30', 'Days to check a customer for a reorder']
];

/* ---------- small utils ---------- */
function num(v) { var n = parseFloat(String(v === undefined || v === null ? '' : v).replace(/,/g, '')); return isNaN(n) ? 0 : n; }
function r2(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }
function isTrue(v) { return v === true || /^(true|yes|y|1)$/i.test(String(v === undefined || v === null ? '' : v).trim()); }
function isDone(v) { var s = String(v === undefined || v === null ? '' : v).trim(); return s !== '' && !/^(no|false|0)$/i.test(s); } /* accepts yes or a date */
function blank(v) { return v === '' || v === undefined || v === null; }
function nowISO() { return new Date().toISOString(); }
function todayStr() { return new Date(Date.now() + 4 * 3600000).toISOString().slice(0, 10); } /* UAE, no DST */
function addDays(d, n) {
  var t = new Date(String(d).slice(0, 10) + 'T12:00:00Z');
  t.setUTCDate(t.getUTCDate() + Number(n || 0));
  return t.toISOString().slice(0, 10);
}
function isOpenFu(a) { return !!a.followupDate && !isDone(a.done); }
function fail(msg) { throw new Error(msg); }
function pick(obj, head) { var o = {}; head.forEach(function (h) { if (obj[h] !== undefined) o[h] = obj[h]; }); return o; }
function isActive(r) { return blank(r.active) || isTrue(r.active); }
function pubUser(u) { return { email: String(u.email).trim().toLowerCase(), name: u.name || String(u.email).split('@')[0], role: String(u.role || 'user').trim().toLowerCase() === 'admin' ? 'admin' : 'user' }; }
function settingsObj(rows) {
  var s = {};
  DEFAULT_SETTINGS.forEach(function (d) { s[d[0]] = d[1]; });
  (rows || []).forEach(function (r) { if (r.key) s[String(r.key).trim()] = r.value === undefined || r.value === null ? '' : String(r.value); });
  return s;
}
function tracked(p) { return p && !blank(p.stock); }
function lowLevel(p, S) { return blank(p.lowAt) ? num(S.lowStock) : num(p.lowAt); }
function stockState(p, S) {
  if (!tracked(p)) return 'uncounted';
  var q = num(p.stock);
  if (q <= 0) return 'out';
  return q <= lowLevel(p, S) ? 'low' : 'ok';
}
function validPin(pin) { return /^[1-9]\d{3,5}$/.test(String(pin || '')); }

/* ============================================================
 * Actions. They need a global DB with: uid(), all(t), upsert(t,obj), remove(t,pred)
 * Every write returns { upsert: {table:[rows]}, remove: {table:[ids]} }
 * ============================================================ */
function newTx() { return { upsert: {}, remove: {} }; }
function put(tx, t, obj) { var row = DB.upsert(t, obj); (tx.upsert[t] = tx.upsert[t] || []).push(row); return row; }
function drop(tx, t, pred) { var ids = DB.remove(t, pred); if (ids.length) tx.remove[t] = (tx.remove[t] || []).concat(ids); }
function findRow(t, id) {
  var k = TABLES[t].key, want = String(id === undefined || id === null ? '' : id);
  if (t === 'users') want = want.trim().toLowerCase();
  return DB.all(t).filter(function (r) { var v = String(r[k]); if (t === 'users') v = v.trim().toLowerCase(); return v === want; })[0];
}
function S_() { return settingsObj(DB.all('settings')); }
function isAdmin(me) { return me.role === 'admin'; }
function needAdmin(me) { if (!isAdmin(me)) fail('Only an admin can do this.'); }

function addAct(tx, me, salonId, f) {
  var a = { id: DB.uid(), salonId: salonId, at: nowISO(), by: me.email, done: '' };
  for (var k in f) a[k] = f[k];
  return put(tx, 'acts', a);
}
function refreshSalon(tx, id, patch) {
  if (!findRow('salons', id)) return null;
  var open = DB.all('acts').filter(function (a) { return String(a.salonId) === String(id) && isOpenFu(a); })
    .map(function (a) { return String(a.followupDate).slice(0, 10); }).sort();
  var p = { id: id, nextFollowup: open[0] || '', updatedAt: nowISO() };
  for (var k in (patch || {})) p[k] = patch[k];
  return put(tx, 'salons', p);
}
function changeStatus(tx, me, salon, to, why) {
  var from = salon.status || 'Lead';
  if (from === to) return;
  addAct(tx, me, salon.id, { type: 'status', note: from + ' → ' + to + (why ? ': ' + why : '') });
  salon.status = to;
  put(tx, 'salons', { id: salon.id, status: to });
}
function cadenceFor(status, S) {
  return num({ 'Lead': S.cadenceLead, 'Sampled': S.cadenceSampled, 'Follow-up': S.cadenceFollowup, 'Customer': S.cadenceCustomer }[status] || S.cadenceFollowup) || 5;
}

/* ---------- stock ----------
 * Products with an empty stock cell are "not counted yet": they are never blocked and nothing is deducted.
 * The first Received or Stock count starts tracking them. */
function stockMove(tx, me, sku, change, reason, x) {
  x = x || {};
  var p = findRow('products', sku);
  if (!p) return null;
  var isSet = reason === 'count';
  if (!tracked(p) && !isSet && reason !== 'receive' && reason !== 'correction' && reason !== 'undo') return null;
  var cur = tracked(p) ? num(p.stock) : 0;
  var bal = isSet ? Math.round(num(x.count)) : cur + Math.round(change);
  var diff = bal - cur;
  if (isSet && tracked(p) && diff === 0) return null;
  put(tx, 'products', { sku: p.sku, stock: bal, updatedAt: nowISO() });
  return put(tx, 'moves', { id: DB.uid(), sku: p.sku, product: p.name, change: diff, balance: bal, reason: reason, ref: x.ref || '', salonId: x.salonId || '', note: x.note || '', at: nowISO(), by: me.email });
}
function linesOf(p) {
  var out = {};
  (p.lines || []).forEach(function (l) { if (l && l.sku && num(l.qty) > 0) out[l.sku] = (out[l.sku] || 0) + Math.round(num(l.qty)); });
  return Object.keys(out).map(function (k) { return { sku: k, qty: out[k] }; });
}

var API = {
  bootstrap: function (me) {
    var admin = isAdmin(me), users = DB.all('users').filter(function (u) { return u.email; });
    var moves = admin ? DB.all('moves').slice(-600) : [];
    return {
      me: me,
      users: users.filter(isActive).map(pubUser),
      names: users.reduce(function (o, u) { o[String(u.email).trim().toLowerCase()] = u.name || ''; return o; }, {}),
      team: admin ? users.map(function (u) { var o = pubUser(u); o.active = isActive(u) ? 'yes' : 'no'; o.hasPin = !!String(u.pin || '').trim(); return o; }) : [],
      salons: DB.all('salons'), acts: DB.all('acts'), samples: DB.all('samples'),
      products: DB.all('products').filter(function (p) { return p.sku && (admin || isActive(p)); }),
      moves: moves,
      settings: S_()
    };
  },

  saveSalon: function (me, p) {
    var tx = newTx(), s = pick(p.salon || {}, TABLES.salons.head), t = nowISO();
    ['lastContact', 'nextFollowup', 'createdAt', 'createdBy', 'updatedAt'].forEach(function (k) { delete s[k]; });
    var ex = s.id ? findRow('salons', s.id) : null;
    if (s.id && !ex) fail('Salon not found.');
    if ((!ex || s.name !== undefined) && !String(s.name || '').trim()) fail('Add the salon name.');
    var wantStatus = s.status;
    if (!ex) {
      s.id = 'S-' + DB.uid().slice(0, 8); s.createdAt = t; s.createdBy = me.email; s.status = 'Lead';
      s.assignedTo = s.assignedTo || me.email;
      put(tx, 'salons', s);
      addAct(tx, me, s.id, { type: 'created', note: 'Salon added' });
      if (wantStatus && wantStatus !== 'Lead') changeStatus(tx, me, findRow('salons', s.id), wantStatus);
      if (p.followupDate) addAct(tx, me, s.id, { type: 'followup', note: p.followupNote || 'First follow-up', followupDate: p.followupDate });
    } else {
      delete s.status;
      put(tx, 'salons', s);
      if (wantStatus && wantStatus !== ex.status) changeStatus(tx, me, findRow('salons', s.id), wantStatus, p.statusReason);
    }
    refreshSalon(tx, s.id, { updatedAt: t });
    return tx;
  },

  deleteSalon: function (me, p) {
    needAdmin(me);
    var tx = newTx(), id = String(p.id);
    drop(tx, 'samples', function (r) { return String(r.salonId) === id; });
    drop(tx, 'acts', function (r) { return String(r.salonId) === id; });
    drop(tx, 'salons', function (r) { return String(r.id) === id; });
    return tx;
  },

  /* type: visit | call | whatsapp | email | meeting | note | sample */
  logActivity: function (me, p) {
    var tx = newTx(), salon = findRow('salons', p.salonId);
    if (!salon) fail('Salon not found.');
    var type = p.type || 'note';
    var lines = (p.samples || []).filter(function (x) { return x && x.product && num(x.qty) > 0; });
    if (type === 'note' && lines.length) type = 'sample';
    var act = addAct(tx, me, salon.id, { type: type, note: p.note || '', lat: p.lat || '', lng: p.lng || '', distance: p.distance === undefined ? '' : p.distance });
    lines.forEach(function (x) {
      var q = Math.round(num(x.qty));
      put(tx, 'samples', { id: DB.uid(), salonId: salon.id, activityId: act.id, product: x.product, sku: x.sku || '', qty: q, at: act.at, by: me.email });
      if (x.sku) stockMove(tx, me, x.sku, -q, 'sample', { ref: act.id, salonId: salon.id, note: salon.name });
    });
    if (lines.length && (salon.status === 'Lead' || !salon.status)) changeStatus(tx, me, salon, 'Sampled');
    if (p.followupDate) addAct(tx, me, salon.id, { type: 'followup', note: p.followupNote || '', followupDate: p.followupDate });
    var patch = {};
    if (CONTACT_TYPES.indexOf(type) >= 0) patch.lastContact = act.at;
    if (p.savePin && p.lat && p.lng) { patch.lat = p.lat; patch.lng = p.lng; }
    refreshSalon(tx, salon.id, patch);
    return tx;
  },

  scheduleFollowup: function (me, p) {
    var tx = newTx();
    if (!findRow('salons', p.salonId)) fail('Salon not found.');
    if (!p.date) fail('Pick a date.');
    addAct(tx, me, p.salonId, { type: 'followup', note: p.note || '', followupDate: p.date });
    refreshSalon(tx, p.salonId);
    return tx;
  },

  completeFollowup: function (me, p) {
    var tx = newTx(), fu = findRow('acts', p.id);
    if (!fu) fail('Follow-up not found.');
    put(tx, 'acts', { id: fu.id, done: 'yes', outcome: (p.outcomeType ? p.outcomeType + ': ' : '') + (p.note || '') });
    var patch = {};
    if (p.outcomeType && p.outcomeType !== 'skip') {
      var a = addAct(tx, me, fu.salonId, { type: p.outcomeType, note: p.note || '' });
      if (CONTACT_TYPES.indexOf(p.outcomeType) >= 0) patch.lastContact = a.at;
    }
    if (p.nextDate) addAct(tx, me, fu.salonId, { type: 'followup', note: p.nextNote || '', followupDate: p.nextDate });
    if (p.status) { var s = findRow('salons', fu.salonId); if (s) changeStatus(tx, me, s, p.status, p.statusReason); if (p.status === 'Lost' && p.statusReason) patch.lostReason = p.statusReason; }
    refreshSalon(tx, fu.salonId, patch);
    return tx;
  },

  snoozeFollowup: function (me, p) {
    var tx = newTx(), fu = findRow('acts', p.id);
    if (!fu) fail('Follow-up not found.');
    if (!p.date) fail('Pick a date.');
    put(tx, 'acts', { id: fu.id, followupDate: p.date });
    refreshSalon(tx, fu.salonId);
    return tx;
  },

  deleteActivity: function (me, p) {
    var a = findRow('acts', p.id);
    if (!a) fail('Not found.');
    if (!isAdmin(me) && a.by !== me.email) fail('You can only delete your own entries.');
    var tx = newTx();
    /* put back any stock this entry took */
    DB.all('moves').filter(function (m) { return String(m.ref) === String(a.id) && m.reason === 'sample'; }).forEach(function (m) {
      stockMove(tx, me, m.sku, -num(m.change), 'undo', { ref: a.id, salonId: a.salonId, note: 'Samples entry deleted' });
    });
    drop(tx, 'samples', function (r) { return String(r.activityId) === String(a.id); });
    drop(tx, 'acts', function (r) { return String(r.id) === String(a.id); });
    refreshSalon(tx, a.salonId);
    return tx;
  },

  /* ---------- stock (admin) ---------- */
  stockAdjust: function (me, p) {
    needAdmin(me);
    var tx = newTx(), prod = findRow('products', p.sku);
    if (!prod) fail('Product not found.');
    var q = Math.round(num(p.qty)), reason = STOCK_REASONS[p.reason] ? p.reason : 'correction';
    if (p.mode === 'set') { if (q < 0) fail('The count cannot be below zero.'); stockMove(tx, me, prod.sku, 0, 'count', { count: q, note: p.note || '' }); }
    else {
      if (q <= 0) fail('Enter how many.');
      var change = p.mode === 'remove' ? -q : q;
      if (!tracked(prod) && change < 0) fail('Count this product first, then remove stock.');
      stockMove(tx, me, prod.sku, change, reason, { note: p.note || '', salonId: p.salonId || '', ref: p.ref || '' });
      if (p.salonId && reason === 'salon') { var s = findRow('salons', p.salonId); if (s) addAct(tx, me, s.id, { type: 'delivery', note: q + ' × ' + prod.name + ' delivered' + (p.ref ? ' (' + p.ref + ')' : '') }); }
    }
    return tx;
  },

  /* many products at once. kind: receive | salon | count */
  stockBatch: function (me, p) {
    needAdmin(me);
    var tx = newTx(), kind = p.kind, lines = kind === 'count' ? (p.lines || []).filter(function (l) { return l && l.sku && l.qty !== '' && l.qty !== undefined && num(l.qty) >= 0; }) : linesOf(p);
    if (!lines.length) fail('Add at least one product.');
    var salon = p.salonId ? findRow('salons', p.salonId) : null;
    if (kind === 'salon' && !salon) fail('Choose the salon.');
    var short = [];
    lines.forEach(function (l) {
      var prod = findRow('products', l.sku);
      if (!prod) return;
      if (kind === 'count') stockMove(tx, me, prod.sku, 0, 'count', { count: num(l.qty), note: p.note || '' });
      else if (kind === 'receive') stockMove(tx, me, prod.sku, num(l.qty), 'receive', { ref: p.ref || '', note: p.note || '' });
      else if (kind === 'salon') {
        if (tracked(prod) && num(prod.stock) < num(l.qty)) short.push(prod.name);
        stockMove(tx, me, prod.sku, -num(l.qty), 'salon', { ref: p.ref || '', salonId: salon.id, note: p.note || salon.name });
      }
    });
    if (kind === 'salon') {
      var units = lines.reduce(function (a, l) { return a + num(l.qty); }, 0);
      addAct(tx, me, salon.id, { type: 'delivery', note: units + ' units delivered' + (p.ref ? ' (' + p.ref + ')' : '') + (short.length ? '. Stock went below zero for ' + short.join(', ') : '') });
      if (salon.status !== 'Customer') changeStatus(tx, me, salon, 'Customer', 'first delivery');
      refreshSalon(tx, salon.id, { lastContact: nowISO() });
    }
    return tx;
  },

  saveProduct: function (me, p) {
    needAdmin(me);
    var tx = newTx(), x = pick(p.product || {}, ['sku', 'code', 'name', 'category', 'size', 'price', 'active', 'lowAt']);
    x.sku = String(x.sku || '').trim();
    if (!x.sku) fail('Add a SKU.');
    var ex = findRow('products', x.sku);
    if (!ex && !String(x.name || '').trim()) fail('Add the product name.');
    if (p.isNew && ex) fail('This SKU already exists.');
    if (x.lowAt !== undefined && x.lowAt !== '' && num(x.lowAt) < 0) fail('Low stock level cannot be negative.');
    x.updatedAt = nowISO();
    if (!ex) { x.active = x.active || 'yes'; x.stock = ''; }
    put(tx, 'products', x);
    return tx;
  },

  /* ---------- team ---------- */
  saveUser: function (me, p) {
    needAdmin(me);
    var tx = newTx(), u = p.user || {}, email = String(u.email || '').trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) fail('Enter a valid email.');
    var ex = findRow('users', email);
    if (p.isNew && ex) fail('This person is already in the team.');
    var row = { email: email };
    if (u.name !== undefined) row.name = String(u.name).trim();
    if (u.role !== undefined) row.role = u.role === 'admin' ? 'admin' : 'user';
    if (u.active !== undefined) row.active = isTrue(u.active) ? 'yes' : 'no';
    if (u.pin) { if (!validPin(u.pin)) fail('PIN must be 4 to 6 digits and not start with 0.'); row.pin = String(u.pin); }
    if (!ex) { if (!row.name) fail('Add their name.'); if (!row.pin) fail('Set a PIN.'); row.role = row.role || 'user'; row.active = row.active || 'yes'; }
    if (ex && email === me.email && (row.role === 'user' || row.active === 'no')) fail('You cannot remove your own admin access.');

/* ---------- API ---------- */
async function api(action, payload = {}) {
  if (DEMO) {
    await sleep(150);
    const out = JSON.parse(JSON.stringify(API[action](DEMO_ME, payload)));
    saveDemo();
    return out;
  }
  let res;
  try { res = await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify(Object.assign({}, payload, { action, token })) }); }
  catch (e) { throw new Error('No connection. Check your internet and try again.'); }
  const j = await res.json().catch(() => ({ ok: false, error: 'The server reply was not readable. Check the API link in config.js.' }));
  if (!j.ok) { if (j.auth) { signOut(true); } throw new Error(j.error || 'Something went wrong.'); }
  return j.data;
}
function busy(on) { $('#bar').classList.toggle('on', !!on); }
async function run(action, payload, okMsg) {
  busy(true);
  try { const tx = await api(action, payload); apply(tx); if (okMsg) toast(okMsg); return tx; }
  catch (e) { toast(e.message, 'bad'); throw e; }
  finally { busy(false); }
}
function apply(tx) {
  Object.entries(tx.upsert || {}).forEach(([t, rows]) => {
    const k = KEYS[t]; if (!k) return;
    rows.forEach(r => { const i = S[t].findIndex(x => String(x[k]) === String(r[k])); if (i >= 0) S[t][i] = Object.assign({}, S[t][i], r); else S[t].push(r); });
  });
  Object.entries(tx.remove || {}).forEach(([t, ids]) => { const k = KEYS[t]; if (!k) return; const set = new Set(ids.map(String)); S[t] = S[t].filter(x => !set.has(String(x[k]))); });
  cache(); render();
}
function cache() { if (!DEMO) LS.set('tbl_cache', S); }
async function refresh(quiet) {
  busy(true);
  try { const d = await api('bootstrap'); Object.assign(S, d); cache(); render(); if (!quiet) toast('Up to date'); }
  catch (e) { if (!quiet || !S.salons.length) toast(e.message, 'bad'); }
  finally { busy(false); }
}
function signOut(expired) { token = null; LS.del('tbl_token'); LS.del('tbl_cache'); S.me = null; nav = { tab: 'today', stack: [] }; closeSheet(); render(); if (expired) toast('Please sign in again.', 'bad'); }

/* ---------- toast ---------- */
let toastT;
function toast(msg, kind) { const t = $('#toast'); t.innerHTML = `<div class="${kind || ''}" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => t.innerHTML = '', kind === 'bad' ? 4200 : 2200); }

/* ---------- navigation ---------- */
const view = () => nav.stack[nav.stack.length - 1] || { v: nav.tab };
function go(v, id, extra) { nav.stack.push(Object.assign({ v, id }, extra || {})); if (!DEMO) try { history.pushState({ d: nav.stack.length }, ''); } catch (e) {} render(); window.scrollTo(0, 0); }
let sheetHist = false, ignorePop = false;
function back() { if ($('.sheet')) { closeSheet(); return; } if (!nav.stack.length) return; if (!DEMO) { try { history.back(); return; } catch (e) {} } nav.stack.pop(); render(); }
function popView() { if (!nav.stack.length) return; nav.stack.pop(); if (!DEMO) { ignorePop = true; try { history.back(); } catch (e) { ignorePop = false; } } }
function tab(t) { nav = { tab: t, stack: [] }; render(); window.scrollTo(0, 0); }
window.addEventListener('popstate', () => { if (ignorePop) { ignorePop = false; return; } if ($('.sheet')) closeSheet(true); else if (nav.stack.length) { nav.stack.pop(); render(); window.scrollTo(0, 0); } });

  const nums = {}; l.forEach(s => nums[s.id] = salonNums(s.id));
  const by = {

  };

  if (!s) return topbar('Salon') + '<div class="wrap"><div class="empty"><b>This salon was removed</b></div></div>';
  const n = salonNums(s.id);
  const fus = (X.acts[s.id] || []).filter(isOpenFu).sort((a, b) => String(a.followupDate).localeCompare(String(b.followupDate)));
  const next = fus[0];
  const tabs = [['timeline', 'Timeline'], ['samples', 'Samples' + (n.samples ? ` (${n.samples})` : '')], ['profile', 'Profile']];
  return `${topbar('', `<button class="ib" data-a="editSalon" data-id="${s.id}" aria-label="Edit salon">${ic('edit')}</button>`)}<div class="wrap" style="padding-top:0">
  <div class="hero"><span class="sw big" data-s="${esc(s.status || 'Lead')}"></span><div style="min-width:0"><h1>${esc(s.name)}</h1>
  <div class="small muted">${esc([s.area, s.emirate].filter(Boolean).join(', '))}${s.assignedTo ? `${s.area || s.emirate ? ', ' : ''}${esc(uName(s.assignedTo))}'s salon` : ''}</div>
  <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="pill wine" data-a="statusSheet" data-id="${s.id}">${esc(s.status || 'Lead')} ${ic('edit', 'tiny').replace('class="i tiny"', 'class="i" style="width:13px;height:13px"')}</button>${s.priority ? `<span class="pill ${s.priority === 'Hot' ? 'bad' : s.priority === 'Warm' ? 'warn' : ''}">${esc(s.priority)}</span>` : ''}${s.priceTier ? `<span class="pill">${esc(s.priceTier)}</span>` : ''}</div></div></div>
  <div class="actions">
    ${actBtn('call', 'phone', 'Call')}${actBtn('wa', 'chat', 'WhatsApp')}${actBtn('directions', 'nav', 'Directions')}${actBtn('checkin', 'pin', 'Check in')}
    ${actBtn('noteSheet', 'note', 'Note')}${actBtn('samplesSheet', 'gift', 'Samples')}${actBtn('fuSheet', 'cal', 'Follow-up')}${actBtn('statusSheet', 'flag', 'Status')}
  </div>
  ${next ? `<div class="card ${fuBucket(next) === 'late' ? 'late' : fuBucket(next) === 'today' ? 'due' : ''}"><div style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><div class="small muted">Next follow-up${fus.length > 1 ? `, ${fus.length - 1} more open` : ''}</div><b>${rel(next.followupDate)}</b>${next.note ? ` <span class="muted">${esc(next.note)}</span>` : ''}</div><button class="btn sm" data-a="fuOpen" data-id="${next.id}">${ic('check')}Done</button></div></div>`
    : `<div class="card"><div style="display:flex;align-items:center;gap:10px"><div style="flex:1" class="muted">No follow-up planned</div><button class="btn sm line" data-a="fuSheet" data-id="${s.id}">Plan one</button></div></div>`}
  <div class="block"><div class="stats">
    <div class="stat"><div class="v">${n.visits}</div><div class="l">Visits</div></div>
    <div class="stat"><div class="v">${n.samples}</div><div class="l">Samples given</div></div>
    <div class="stat"><div class="v">${s.lastContact ? ago(s.lastContact) : 'Never'}</div><div class="l">Last contact</div></div>
    <div class="stat"><div class="v">${s.createdAt ? ago(s.createdAt) : '–'}</div><div class="l">Added</div></div>
  </div></div>
  <div class="seg">${tabs.map(([k, l]) => `<button class="${ui.salonTab === k ? 'on' : ''}" data-a="salonTab" data-id="${k}">${l}</button>`).join('')}</div>
  ${ui.salonTab === 'samples' ? salonSamples(s) : ui.salonTab === 'profile' ? salonProfile(s) : salonTimeline(s)}
  </div>`;
}
const actBtn = (a, i, l) => `<button class="act" data-a="${a}" data-id="${view().id}">${ic(i)}${l}</button>`;
function salonTimeline(s) {
  const l = (X.acts[s.id] || []).filter(a => !isOpenFu(a));
  return `<div class="block">${l.map(a => actRow(a, false)).join('') || '<div class="empty"><b>No history yet</b>Check in, call or leave samples to start the timeline.</div>'}</div>`;
}
function salonProfile(s) {
  const map = s.lat && s.lng && !DEMO ? `<iframe title="Map" loading="lazy" style="width:100%;height:200px;border:0;display:block" src="https://maps.google.com/maps?q=${encodeURIComponent(s.lat + ',' + s.lng)}&z=16&output=embed"></iframe>` : '';
  const kv = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : '';
  const link = (href, t) => `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(t)}</a>`;
  const ig = String(s.instagram || '').replace(/^@/, '').replace(/^https?:\/\/(www\.)?instagram\.com\//, '').replace(/\/$/, '');
  return `<div class="block">${map}<dl class="kv">
    ${kv('Owner', esc(s.owner))}${kv('Decision maker', esc([s.decisionMaker, s.decisionRole].filter(Boolean).join(', ')))}
    ${kv('Phone', s.phone ? link('tel:' + s.phone, s.phone) : '')}${kv('WhatsApp', s.whatsapp ? link('https://wa.me/' + waNum(s.whatsapp), s.whatsapp) : '')}
    ${kv('Instagram', ig ? link('https://instagram.com/' + ig, '@' + ig) : '')}${kv('Email', s.email ? link('mailto:' + s.email, s.email) : '')}
    ${kv('Address', esc(s.address))}${kv('Hours', esc(s.hours))}
    ${kv('Chairs', esc(s.chairs))}${kv('Staff', esc(s.staff))}${kv('Brands they use', esc(s.brandsUsed))}${kv('Price level', esc(s.priceTier))}
    ${kv('Tags', esc(s.tags))}${kv('Source', esc(s.source))}${kv('Lost reason', esc(s.lostReason))}
    ${kv('Added', esc(fmtD(s.createdAt, true) + (s.createdBy ? ' by ' + uName(s.createdBy) : '')))}
  </dl>${s.notes ? `<div style="padding:0 16px 16px;white-space:pre-wrap">${esc(s.notes)}</div>` : ''}</div>
  ${isAdminMe() ? `<button class="btn danger block" data-a="delSalon" data-id="${s.id}">${ic('trash')}Delete salon</button>` : ''}`;
}

/* FOLLOW-UPS */
function vFollowups() {
  const all = openFus(ui.fuMine);
  const b = { late: all.filter(a => fuBucket(a) === 'late'), today: all.filter(a => fuBucket(a) === 'today'), next: all.filter(a => fuBucket(a) === 'next') };
  const done = S.acts.filter(a => a.followupDate && isDone(a.done) && X.salon[a.salonId]).sort((x, y) => String(y.at).localeCompare(String(x.at))).slice(0, 40);
  const list = ui.fuSeg === 'done' ? done : b[ui.fuSeg];
  const stale = S.salons.filter(s => s.status !== 'Lost' && !s.nextFollowup && (!ui.fuMine || s.assignedTo === S.me.email));
  return `${rootTop()}<div class="wrap" style="padding-top:0"><h1 style="padding:8px 0 10px">Follow-ups</h1>
  <div class="seg">${[['late', 'Overdue', b.late.length], ['today', 'Today', b.today.length], ['next', 'Upcoming', b.next.length], ['done', 'Done']].map(([k, l, n]) => `<button class="${ui.fuSeg === k ? 'on' : ''}" data-a="fuSeg" data-id="${k}">${l}${n !== undefined ? ' ' + n : ''}</button>`).join('')}</div>
  <div class="chips"><button class="chip ${ui.fuMine ? 'on' : ''}" data-a="fuMine">My salons only</button></div>
  <div class="block">${ui.fuSeg === 'done' ? (done.map(a => actRow(a, true)).join('') || '<div class="empty"><b>Nothing completed yet</b></div>')
    : (list.map(a => { const s = X.salon[a.salonId]; return `${fuRow(a)}<div class="btns" style="padding:0 16px 12px 42px"><button class="btn sm ghost" data-a="quickCall" data-id="${s.id}">${ic('phone')}Call</button><button class="btn sm ghost" data-a="quickWa" data-id="${s.id}" data-fu="${a.id}">${ic('chat')}WhatsApp</button><button class="btn sm ghost" data-a="snooze" data-id="${a.id}">${ic('clock')}Later</button></div>`; }).join('')
      || `<div class="empty"><b>${ui.fuSeg === 'late' ? 'Nothing overdue' : ui.fuSeg === 'today' ? 'Nothing due today' : 'Nothing planned'}</b>${ui.fuSeg === 'next' ? 'Plan follow-ups from any salon page.' : 'Nice work.'}</div>`)}</div>
  ${stale.length && ui.fuSeg !== 'done' ? `<div class="sec"><h2>No follow-up planned</h2></div><p class="small muted" style="margin:0 2px">Salons that will slip through the cracks unless you plan a next step.</p><div class="block">${stale.slice(0, 15).map(s => `<button class="row" data-a="fuSheet" data-id="${s.id}"><span class="sw" data-s="${esc(s.status || 'Lead')}"></span><div class="main"><div class="t">${esc(s.name)}</div><div class="s">Contacted ${ago(s.lastContact).toLowerCase()}</div></div><span class="pill wine">Plan</span></button>`).join('')}</div>` : ''}
  </div>`;
}

/* ---------- sheets (bottom panels) ---------- */
function openSheet(title, body, foot) {
  $('#sheet-root').innerHTML = `<div class="scrim" data-a="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh"><h2>${esc(title)}</h2><button class="ib" data-a="closeSheet" aria-label="Close">${ic('x')}</button></div><div class="sb">${body}</div>${foot ? `<div class="sf">${foot}</div>` : ''}</div>`;
  if (!DEMO && !sheetHist) { try { history.pushState({ sheet: 1 }, ''); sheetHist = true; } catch (e) {} }
}
function closeSheet(fromPop) {
  $('#sheet-root').innerHTML = '';
  if (sheetHist && !fromPop) { sheetHist = false; ignorePop = true; try { history.back(); } catch (e) { ignorePop = false; } } else sheetHist = false;
}
function vals() { const o = {}; document.querySelectorAll('.sheet [name]').forEach(el => { o[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim(); }); return o; }
function dateChips(name, def, allowNone) {
  const v = def === null || def === undefined ? '' : addDays(today(), def);
  const opts = [[1, 'Tomorrow'], [3, 'In 3 days'], [7, 'In a week'], [14, 'In 2 weeks'], [30, 'In a month']];
  return `<div class="chips">${allowNone ? `<button class="chip ${v ? '' : 'on'}" data-a="setDate" data-n="${name}" data-days="">None</button>` : ''}${opts.map(([d, l]) => `<button class="chip ${d === def ? 'on' : ''}" data-a="setDate" data-n="${name}" data-days="${d}">${l}</button>`).join('')}</div><label class="f"><input type="date" name="${name}" value="${v}" aria-label="Date"></label>`;
}
const optChips = (name, opts, cur) => `<input type="hidden" name="${name}" value="${esc(cur)}"><div class="chips" style="flex-wrap:wrap">${opts.map(([v, l]) => `<button class="chip ${v === cur ? 'on' : ''}" data-a="pickOpt" data-n="${name}" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div>`;
const fld = (label, name, val, attrs = '') => `<label class="f"><span>${label}</span><input name="${name}" value="${esc(val)}" ${attrs}></label>`;
const sel = (label, name, opts, cur) => `<label class="f"><span>${label}</span><select name="${name}">${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(cur || '') ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select></label>`;

function sPaint() {
  const L = $('#s-lines'), R = $('#s-results'); if (!L) return;
  L.innerHTML = SAMP.lines.map((l, i) => `<div class="line"><div class="nm">${esc(l.product)}</div><div class="step"><button data-a="sqty" data-id="${i}" data-d="-1" aria-label="Less">−</button><input type="number" value="${l.qty}" data-sl="${i}" aria-label="Quantity"><button data-a="sqty" data-id="${i}" data-d="1" aria-label="More">+</button></div></div>`).join('') || '<div class="empty" style="padding:16px 4px">Search above and tap products to add them.</div>';

  R.innerHTML = `<div class="results">${hits.map(p => `<button class="row" data-a="sAdd" data-id="${esc(p.sku)}"><div class="main"><div class="t">${esc(p.name)}</div><div class="s">${esc(p.sku)}${tracked(p) ? ', ' + Math.max(0, num(p.stock)) + ' on shelf' : ''}</div></div>${tracked(p) && num(p.stock) <= 0 ? '<span class="pill bad">Out</span>' : ic('plus')}</button>`).join('')}<button class="row" data-a="sAddCustom"><div class="main"><div class="t">Add "${esc(SAMP.q.trim())}" as other item</div><div class="s">Brochure, box, not from stock</div></div>${ic('plus')}</button></div>`;
}

function checkinSheet(salonId) {
  const s = X.salon[salonId]; CI = { salonId };
  openSheet('Check in', `<p class="muted" style="margin:0 0 12px">${esc(s.name)}</p><div class="card" id="ci-status">Finding your location…</div>

async function api(action, payload = {}) {

  let res;
  try { res = await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify(Object.assign({}, payload, { action, token })) }); }
  catch (e) { const er = new Error('No connection. Check your internet and try again.'); er.offline = true; throw er; }
  const j = await res.json().catch(() => ({ ok: false, error: 'The server reply was not readable. Check the API link in config.js.' }));
  if (!j.ok) { if (j.auth) { signOut(true); } throw new Error(j.error || 'Something went wrong.'); }
  return j.data;
}
const QUEUE_OK = ['logActivity', 'scheduleFollowup', 'completeFollowup', 'snoozeFollowup', 'saveSalon', 'saveOrder', 'setOrderStatus'];
let Q = LS.get('tbl_queue', []), flushing = false;

  uid() { const id = (Date.now().toString(36) + Math.random().toString(36).slice(2, 9)).slice(-14); if (window.__ids) window.__ids.push(id); return id; },
  all(t) { if (t === 'settings') return Object.entries(S.settings).map(([key, value]) => ({ key, value })); if (t === 'users') return S.team && S.team.length ? S.team : S.users; return S[t] || (S[t] = []); },
  upsert(t, o) { if (t === 'settings' || t === 'users') return o; const k = TABLES[t].key, a = DB.all(t), ex = a.find(r => String(r[k]) === String(o[k])); if (ex) { Object.assign(ex, o); return Object.assign({}, ex); } const n = Object.assign({}, o); a.push(n); return Object.assign({}, n); },
  remove(t, p) { const k = TABLES[t].key, a = DB.all(t), ids = a.filter(p).map(r => r[k]); S[t] = a.filter(r => !p(r)); return ids; }
};
function queueLocal(action, payload, okMsg) {
  const now = new Date().toISOString();
  window.__ids = []; NOW_OVERRIDE = now;
  let tx;
  try { tx = API[action](S.me, JSON.parse(JSON.stringify(payload))); }
  finally { NOW_OVERRIDE = ''; }
  Q.push({ action, payload, _ids: window.__ids, _now: now }); window.__ids = null;
  LS.set('tbl_queue', Q);
  apply(tx);
  toast((okMsg || 'Saved') + ' on this phone. It syncs when you are back online.');
  return tx;
}
async function flush() {
  if (DEMO || flushing || !Q.length || !token || !navigator.onLine) return;
  flushing = true; render();
  let synced = 0;
  try {
    while (Q.length) {
      const it = Q[0];
      try { const tx = await api(it.action, Object.assign({}, it.payload, { _ids: it._ids, _now: it._now })); Q.shift(); LS.set('tbl_queue', Q); apply(tx); synced++; }
      catch (e) { if (e.offline) break; Q.shift(); LS.set('tbl_queue', Q); toast('One offline change could not be saved: ' + e.message, 'bad'); }
    }
  } finally { flushing = false; }
  if (!Q.length) { await refresh(true); if (synced) toast(synced + ' offline change' + (synced === 1 ? '' : 's') + ' synced'); } else render();
}
window.addEventListener('online', () => { render(); flush(); });
window.addEventListener('offline', () => render());
setInterval(flush, 30000);

}
async function run(action, payload, okMsg) {
  busy(true);

    if (!DEMO && QUEUE_OK.includes(action) && (Q.length || !navigator.onLine)) return queueLocal(action, payload, okMsg);
    const tx = await api(action, payload); apply(tx); if (okMsg) toast(okMsg); return tx;
  } catch (e) {

    toast(e.message, 'bad'); throw e;

}

  Object.entries(tx.upsert || {}).forEach(([t, rows]) => {
    const k = KEYS[t]; if (!k || !S[t]) return;

function startOrder(salonId, from, repeat) {
  const s = X.salon[salonId] || {};

    deliveryDate: addDays(today(), 2), deliverySlot: 'Any time', deliveryAddress: s.address || '', deliveryArea: s.area || '', deliveryEmirate: s.emirate || '',
    contactName: s.owner || '', contactPhone: s.phone || s.whatsapp || '', paymentMethod: 'Cash on delivery', poRef: '' };
  if (from) {
    ['discountMode', 'discountPct', 'deliveryMode', 'deliverySlot', 'deliveryAddress', 'deliveryArea', 'deliveryEmirate', 'contactName', 'contactPhone', 'paymentMethod'].forEach(k => { if (from[k] !== undefined && from[k] !== '') ED[k] = from[k]; });
    if (!repeat) Object.assign(ED, { id: from.id, status: from.status, notes: from.notes || '', poRef: from.poRef || '', deliveryDate: localDate(from.deliveryDate) || ED.deliveryDate });
    ED.lines = (X.items[from.id] || []).filter(i => !repeat || !i.sku || (X.prod[i.sku] && isActive(X.prod[i.sku]))).map(i => ({ sku: i.sku || '', product: i.sku && X.prod[i.sku] ? pLabel(X.prod[i.sku]) : i.product, qty: num(i.qty), price: repeat && i.sku && X.prod[i.sku] ? num(X.prod[i.sku].price) : num(i.price) }));
  }
  go('orderEdit');
}

const fldCh = (label, k, v) => `<label class="f"><span>${label}</span><input data-ch="${k}" value="${esc(v)}"></label>`;
function edAddrNote() {
  const el = $('#ed-addr-note'), s = X.salon[ED.salonId]; if (!el || !s) return;
  const changed = s.address && (ED.deliveryAddress.trim() !== String(s.address).trim() || (ED.deliveryArea || '') !== (s.area || '') || (ED.deliveryEmirate || '') !== (s.emirate || ''));

function edPaint(skipLines) {
  const L = $('#ed-lines'), T = $('#ed-totals'), R = $('#ed-results');
  if (!L) return;
  edAddrNote();
  const sm = showMoney();
  if (!skipLines) L.innerHTML = ED.lines.map((l, i) => { const p = X.prod[l.sku], short = p && tracked(p) && num(p.stock) < num(l.qty); return `<div class="line"><div class="nm">${esc(l.product)}<div class="small muted">${sm ? money(num(l.qty) * num(l.price)) : ''}${p && tracked(p) ? `${sm ? ', ' : ''}<span style="${short ? 'color:var(--bad);font-weight:700' : ''}">${num(p.stock)} in stock</span>` : ''}</div></div>
    ${sm ? `<input class="price" type="number" inputmode="decimal" step="0.01" data-li="${i}" data-f="price" value="${esc(l.price)}" aria-label="Unit price">` : ''}
    <div class="step"><button data-a="qty" data-id="${i}" data-d="-1" aria-label="Less">−</button><input type="number" inputmode="numeric" data-li="${i}" data-f="qty" value="${esc(l.qty)}" aria-label="Quantity"><button data-a="qty" data-id="${i}" data-d="1" aria-label="More">+</button></div></div>`; }).join('')
    || '<div class="empty" style="padding:20px 6px"><b>No products yet</b>Search above and tap to add.</div>';
  const t = calcTotals(ED.lines, S.settings, ED);
  const nextTier = num(S.settings.tier1Amount) > t.subtotal ? [num(S.settings.tier1Amount), S.settings.tier1Pct] : num(S.settings.tier2Amount) > t.subtotal ? [num(S.settings.tier2Amount), S.settings.tier2Pct] : null;
  T.innerHTML = sm ? `${totalsGrid(t)}<p class="small muted" style="margin:10px 0 0">${t.units} units. Estimate, the Zoho invoice is final.${ED.discountMode !== 'manual' && nextTier && t.subtotal > 0 ? ` Add ${money(nextTier[0] - t.subtotal, 0)} more for ${nextTier[1]}% off.` : ''}</p>${t.belowMin ? `<div class="warnbox">Below the ${money(S.settings.minOrder, 0)} minimum order.</div>` : ''}`
    : `<div class="tot"><span class="big">Units</span><span class="big">${t.units}</span></div><p class="tiny muted" style="margin:8px 0 0">Add prices in the Products tab of the sheet to see estimates here.</p>`;
  const q = ED.q.trim().toLowerCase();
  if (!q) { R.innerHTML = ''; return; }
  const words = q.split(/\s+/).filter(Boolean);
  const hits = S.products.filter(p => isActive(p) && words.every(w => [p.sku, p.code, p.name, p.category, p.size].join(' ').toLowerCase().includes(w))).slice(0, 30);
  R.innerHTML = `<div class="results">${hits.map(p => `<button class="row" data-a="addLine" data-id="${esc(p.sku)}"><div class="main"><div class="t">${esc(p.name)}</div><div class="s">${esc([p.size, p.sku].filter(Boolean).join(', '))}</div></div><div class="end">${sm && num(p.price) ? `<b class="small">${money(p.price)}</b><br>` : ''}${stkPill(p)}</div></button>`).join('')}
  <button class="row" data-a="addCustom"><div class="main"><div class="t">Add "${esc(ED.q.trim())}"</div><div class="s">Not in the list</div></div>${ic('plus')}</button></div>`;
}

/* share texts */
function orderText(o, forSalon) {
  const s = X.salon[o.salonId] || {}, items = X.items[o.id] || [], sm = showMoney() && num(o.subtotal);
  const L = forSalon
    ? [`Hi ${first(s.owner) || 'there'}, thank you for your order with ${S.settings.businessName}!`, '', `*Order ${oName(o)}*`]
    : [`*New order ${oName(o)}*`, `Salon: ${s.name || ''}`, `Taken by: ${uName(o.createdBy)}`];
  L.push('');
  items.forEach(i => L.push(`${i.qty} × ${i.product}${sm && num(i.price) ? ' = ' + money(i.lineTotal) : ''}`));
  L.push(`Units: ${num(o.units)}`);
  if (sm) { if (num(o.discount)) L.push(`Discount ${num(o.discountPct)}%: −${money(o.discount)}`); L.push(`Delivery: ${num(o.delivery) ? money(o.delivery) : 'Free'}`); if (num(o.vatRate)) L.push(`VAT: ${money(o.vat)}`); L.push(`*Estimated total: ${money(o.total)}*`); }
  L.push('', `*Delivery:* ${o.deliveryDate ? fmtD(o.deliveryDate, true) : 'to confirm'}${o.deliverySlot ? ', ' + o.deliverySlot : ''}`);
  L.push([o.deliveryAddress, o.deliveryArea, o.deliveryEmirate].filter(Boolean).join(', '));
  if (o.contactName || o.contactPhone) L.push(`Receiver: ${[o.contactName, o.contactPhone].filter(Boolean).join(', ')}`);
  if (o.paymentMethod) L.push(`Payment: ${o.paymentMethod}`);
  if (!forSalon && o.poRef) L.push(`Salon ref: ${o.poRef}`);
  if (!forSalon && o.notes) L.push('', `Notes: ${o.notes}`);
  if (!forSalon && s.trn) L.push(`TRN: ${s.trn}`);
  if (forSalon) L.push('', 'Your invoice will follow from our accounts team.');
  return L.join('\n');
}

/* handlers */
Object.assign(H, {
  oFilter: id => { ui.oFilter = id; render(); }, oMine: () => { ui.oMine = !ui.oMine; render(); },
  openOrder: id => go('order', id), openSamples: () => go('samples'),
  newOrderFor: id => startOrder(id),
  newOrder: () => pickSalonSheet(id => startOrder(id)),
  pickSalonForOrder: () => pickSalonSheet(id => { const s = X.salon[id]; ED.salonId = id; if (s) Object.assign(ED, { deliveryAddress: s.address || '', deliveryArea: s.area || '', deliveryEmirate: s.emirate || '', contactName: s.owner || '', contactPhone: s.phone || s.whatsapp || '' }); render(); }),
  editOrder: id => { const o = X.order[id]; startOrder(o.salonId, o); },
  reorder: id => { const o = X.order[id]; startOrder(o.salonId, o, true); toast('Copied. Check quantities and the delivery date.'); },
  edAddrSave(_, el) { ED.updateSalonAddress = el.checked; },
  edDate(_, el) { ED.deliveryDate = addDays(today(), +el.dataset.days); render(); },
  edSet(_, el) { ED[el.dataset.k] = el.dataset.v; el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); },
  addLine(sku) { const p = X.prod[sku] || {}, ex = ED.lines.find(l => l.sku === sku); if (ex) ex.qty = num(ex.qty) + 1; else ED.lines.push({ sku, product: pLabel(p), qty: 1, price: num(p.price) }); ED.q = ''; $('#edq').value = ''; $('#edq').focus(); edPaint(); },
  addCustom() { ED.lines.push({ sku: '', product: ED.q.trim(), qty: 1, price: 0 }); ED.q = ''; $('#edq').value = ''; edPaint(); },
  qty(i, el) { const l = ED.lines[+i]; l.qty = Math.max(0, num(l.qty) + +el.dataset.d); if (!l.qty) ED.lines.splice(+i, 1); edPaint(); },
  async saveOrder(_, el) {
    if (!ED.salonId) { toast('Choose a salon first.', 'bad'); return; }
    if (!ED.lines.length) { toast('Add at least one product.', 'bad'); return; }
    const st = el.dataset.s;
    if (st === 'Submitted') {
      if (!ED.deliveryDate) { toast('Pick a preferred delivery date.', 'bad'); return; }
      if (!ED.deliveryAddress.trim()) { toast('Add the delivery address.', 'bad'); return; }
      const short = ED.lines.filter(l => { const p = X.prod[l.sku]; return p && tracked(p) && num(p.stock) < num(l.qty); });
      if (short.length && !confirm('Not enough stock for: ' + short.map(l => l.product).join(', ') + '. Submit anyway?')) return;
      const t = calcTotals(ED.lines, S.settings, ED);
      if (t.belowMin && !confirm(`This order is below the ${money(S.settings.minOrder, 0)} minimum. Submit anyway?`)) return;
    }
    const order = Object.assign({}, ED); delete order.lines; delete order.q; delete order.updateSalonAddress;
    if (st) order.status = st; else delete order.status;
    try {
      const tx = await run('saveOrder', { order, items: ED.lines, updateSalonAddress: !!ED.updateSalonAddress }, st === 'Submitted' ? 'Order submitted' : st === 'Draft' ? 'Draft saved' : 'Saved');
      const saved = (tx.upsert.orders || []).slice(-1)[0]; const wasNew = !ED.id; ED = null; popView();
      if (wasNew && saved) go('order', saved.id); else render();
      if (st === 'Submitted' && S.settings.opsWhatsApp && saved && confirm('Send this order to the office on WhatsApp now?')) H.sendOps(saved.id);
    } catch (e) {}
  },
  async setOStatus(id, el) {
    const s = el.dataset.s;
    if (s === 'Delivered' && !confirm('Mark as delivered? The products come out of stock.')) return;
    try { await run('setOrderStatus', { id, status: s }, s === 'Submitted' ? 'Order submitted' : s === 'Delivered' ? 'Marked as delivered' : 'Updated');
      if (s === 'Submitted' && S.settings.opsWhatsApp && confirm('Send this order to the office on WhatsApp now?')) H.sendOps(id); } catch (e) {}
  },
  invoiceSheet(id) {
    openSheet('Invoiced in Zoho', `<p class="muted" style="margin:0 0 12px">Add the Zoho Books invoice number so anyone can find it later.</p>${fld('Zoho invoice number', 'zoho', '', 'placeholder="INV-000123" autocapitalize="characters"')}`,
      `<button class="btn block" data-a="saveInvoiced" data-id="${id}">${ic('check')}Mark as invoiced</button>`);
  },
  async saveInvoiced(id) { const v = vals(); try { await run('setOrderStatus', { id, status: 'Invoiced', zohoInvoice: v.zoho }, 'Marked as invoiced'); closeSheet(); } catch (e) {} },
  cancelOrder(id) {
    openSheet('Cancel order', `${fld('Reason', 'reason', '', 'placeholder="Salon changed their mind, out of stock..."')}`, `<button class="btn danger block" data-a="saveCancel" data-id="${id}">Cancel order</button>`);
  },
  async saveCancel(id) { const v = vals(); try { await run('setOrderStatus', { id, status: 'Cancelled', reason: v.reason }, 'Order cancelled'); closeSheet(); } catch (e) {} },
  async delOrder(id) { if (!confirm('Delete this order completely?')) return; try { await run('deleteOrder', { id }, 'Order deleted'); back(); } catch (e) {} },
  sendOps(id) { const o = X.order[id]; window.open('https://wa.me/' + waNum(S.settings.opsWhatsApp) + '?text=' + encodeURIComponent(orderText(o, false)), '_blank'); },
  sendSalon(id) { const o = X.order[id], s = X.salon[o.salonId] || {}; window.open('https://wa.me/' + waNum(s.whatsapp || s.phone) + '?text=' + encodeURIComponent(orderText(o, true)), '_blank'); }
});
document.addEventListener('input', e => {
