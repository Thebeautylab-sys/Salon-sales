  if (t.dataset.in === 'oq') { ui.oq = t.value; const pos = t.selectionStart; render(); const n = document.getElementById('oq'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } return; }
  if (t.dataset.ch && ED) { ED[t.dataset.ch] = t.value; const a = $('#ed-dpct'); if (a) a.style.display = ED.discountMode === 'manual' ? '' : 'none'; edPaint(true); return; }
  if (t.dataset.li !== undefined && ED) { ED.lines[+t.dataset.li][t.dataset.f] = t.value; edPaint(true); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.li !== undefined && ED) { const l = ED.lines[+t.dataset.li]; if (l && t.dataset.f === 'qty' && num(l.qty) <= 0) ED.lines.splice(+t.dataset.li, 1); edPaint(); }
  if (t.dataset.ch === 'deliveryDate' && ED) render();
});

/* ============================================================
 * 3.1: location, reorder radar, plan my day, targets, Zoho UI
 * ============================================================ */
function getPos(cb, quiet) {
  if (ui.pos && Date.now() - ui.pos.at < 300000) { cb && cb(ui.pos); return; }
  if (!navigator.geolocation) { if (!quiet) toast('Location is not available on this device.', 'bad'); return; }
  navigator.geolocation.getCurrentPosition(p => { ui.pos = { lat: p.coords.latitude, lng: p.coords.longitude, at: Date.now() }; cb && cb(ui.pos); render(); },
    () => { if (!quiet) toast('Allow location for this app in your phone settings.', 'bad'); }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 120000 });
}
const distTo = s => ui.pos && s.lat && s.lng ? dist(ui.pos.lat, ui.pos.lng, num(s.lat), num(s.lng)) : null;
const km = m => m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(m < 10000 ? 1 : 0) + ' km';

/* REORDER RADAR */
function radar() {
  const t = today(), cad = num(S.settings.cadenceCustomer) || 30;
  return S.salons.filter(s => s.status !== 'Lost').map(s => {
    const all = X.orders[s.id] || [];
    if (all.some(o => o.status === 'Submitted' || o.status === 'Invoiced')) return null;
    const live = all.filter(liveOrd); if (!live.length) return null;
    const ds = live.map(o => localDate(o.deliveredAt || o.deliveryDate || o.orderDate)).sort();
    const gaps = []; for (let i = 1; i < ds.length; i++) { const g = daysBetween(ds[i - 1], ds[i]); if (g >= 5) gaps.push(g); }
    const every = gaps.length ? Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length) : cad;
    const last = ds[ds.length - 1], since = daysBetween(last, t);
    return { s, every, learned: gaps.length, last, since, left: every - since, lastOrder: live[0], units: Math.round(live.reduce((a, o) => a + num(o.units), 0) / live.length) };
  }).filter(Boolean).sort((a, b) => a.left - b.left);
}
const radarPill = r => r.left < 0 ? `<span class="pill bad">${-r.left} days late</span>` : r.left === 0 ? '<span class="pill warn">Due today</span>' : r.left <= 3 ? `<span class="pill warn">In ${r.left} days</span>` : `<span class="pill">In ${r.left} days</span>`;
function radarRow(r) {
  return `<div class="row" style="cursor:default"><span class="sw" data-s="${esc(r.s.status || 'Customer')}"></span><button class="main" style="background:none;border:0;text-align:left;padding:0;cursor:pointer" data-a="openSalon" data-id="${r.s.id}"><div class="t">${esc(r.s.name)}</div><div class="s">Every ${r.every} days${r.learned ? '' : ' (default)'}, last ${r.since} days ago, about ${r.units} units</div></button><div class="end">${radarPill(r)}<br><button class="link" data-a="reorder" data-id="${r.lastOrder.id}" style="padding:4px 0">Reorder</button></div></div>`;
}
function radarToday() {
  const l = radar().filter(r => r.left <= 3);
  if (!l.length) return '';
  return `<div class="sec"><h2>Due to reorder</h2><button class="link" data-a="openRadar">Radar</button></div><div class="block">${l.slice(0, 5).map(radarRow).join('')}</div>`;
}
function radarCard(s) {
  const r = radar().find(x => x.s.id === s.id);
  if (!r) return '';
  return `<div class="card ${r.left < 0 ? 'late' : r.left <= 3 ? 'due' : ''}"><div style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><div class="small muted">${ic('radar', 'sm')} Reorder radar</div><b>${r.left < 0 ? 'Reorder is ' + (-r.left) + ' days late' : r.left === 0 ? 'Reorder due today' : 'Next reorder in ' + r.left + ' days'}</b><div class="small muted">Orders every ${r.every} days${r.learned ? ', learned from ' + (r.learned + 1) + ' orders' : ' (default until a second order)'}. Last ${r.since} days ago.</div></div><button class="btn sm" data-a="reorder" data-id="${r.lastOrder.id}">${ic('copy')}Reorder</button></div></div>`;
}
function vRadar() {
  const l = radar();
  return `${topbar('Reorder radar')}<div class="wrap" style="padding-top:0">
  <p class="small muted" style="margin:0 2px 8px">Learns how often each customer orders. After two orders it uses their real rhythm, before that the ${num(S.settings.cadenceCustomer) || 30} day default. Customers with an order on the way are hidden.</p>
  <div class="block">${l.map(radarRow).join('') || '<div class="empty"><b>No customers yet</b>Customers show up here after their first order.</div>'}</div></div>`;
}

/* PLAN MY DAY */
function planCandidates() {
  const t = today(), rad = {}; radar().forEach(r => rad[r.s.id] = r);
  return S.salons.filter(s => s.status !== 'Lost').map(s => {
    const why = []; let score = 0;
    const fu = (X.acts[s.id] || []).filter(isOpenFu).sort((a, b) => String(a.followupDate).localeCompare(String(b.followupDate)))[0];
    if (fu && localDate(fu.followupDate) <= t) { score += 100; why.push(fuBucket(fu) === 'late' ? 'Follow-up overdue' : 'Follow-up today'); }
    else if (fu && localDate(fu.followupDate) <= addDays(t, 2)) { score += 30; why.push('Follow-up ' + rel(fu.followupDate).toLowerCase()); }
    const r = rad[s.id]; if (r && r.left <= 3) { score += 90; why.push(r.left < 0 ? 'Reorder ' + (-r.left) + ' days late' : 'Reorder due'); }
    const since = s.lastContact ? daysBetween(s.lastContact, t) : null;
    if (s.priority === 'Hot') { score += 50; why.push('Hot'); } else if (s.priority === 'Warm') { score += 25; }
    if (s.status === 'Sampled' && since !== null && since >= 7) { score += 40; why.push('Sampled, no news for ' + since + ' days'); }
    if ((s.status || 'Lead') === 'Lead' && !(X.acts[s.id] || []).some(a => typeOf(a) === 'visit')) { score += 30; why.push('Never visited'); }
    if (since !== null && since >= 21 && s.status !== 'Customer') { score += 15; why.push('Quiet for ' + since + ' days'); }
    if (!why.length) return null;
    return { s, score, why, d: distTo(s) };
  }).filter(Boolean);
}
function vPlan() {
  const ems = EMIRATES.filter(e => e && S.salons.some(s => s.emirate === e));
  let l = planCandidates();
  if (ui.planArea === 'near') l = ui.pos ? l.filter(c => c.d !== null && c.d <= 20000) : [];
  else l = l.filter(c => c.s.emirate === ui.planArea);
  l.sort((a, b) => b.score - a.score || (a.d || 0) - (b.d || 0));
  const pick = ui.planPick.filter(id => X.salon[id]);
  return `${topbar('Plan my day')}<div class="wrap" style="padding-top:0">
  <p class="small muted" style="margin:0 2px 8px">The app ranks who to see: due follow-ups, reorders, hot leads, sampled salons gone quiet. Tick up to 10 and open the route.</p>
  <div class="chips"><button class="chip ${ui.planArea === 'near' ? 'on' : ''}" data-a="planArea" data-id="near">${ic('pin', 'sm')}Near me</button>${ems.map(e => `<button class="chip ${ui.planArea === e ? 'on' : ''}" data-a="planArea" data-id="${e}">${e}</button>`).join('')}</div>
  ${ui.planArea === 'near' && !ui.pos ? '<div class="block"><div class="empty"><b>Finding your location…</b>Allow location if your phone asks.</div></div>' : `
  <div class="block">${l.map(c => { const on = pick.includes(c.s.id), pinned = c.s.lat && c.s.lng; return `<div class="row" style="cursor:default"><button class="tick ${on ? 'on' : ''}" data-a="planToggle" data-id="${c.s.id}" ${pinned ? '' : 'disabled'} aria-label="Add to route">${on ? ic('check') : ''}</button><button class="main" style="background:none;border:0;text-align:left;padding:0;cursor:pointer" data-a="openSalon" data-id="${c.s.id}"><div class="t">${esc(c.s.name)}</div><div class="s" style="white-space:normal">${esc(c.why.join(', '))}${pinned ? '' : '. No map pin yet, check in once to pin it'}</div></button><div class="end small">${c.d !== null ? '<b>' + km(c.d) + '</b><br>' : ''}<span class="sw" data-s="${esc(c.s.status || 'Lead')}" style="display:inline-block"></span></div></div>`; }).join('') || '<div class="empty"><b>Nothing urgent here</b>Try another area.</div>'}</div>`}
  <div class="planbar"><span><b>${pick.length}</b> stop${pick.length === 1 ? '' : 's'} picked</span>${pick.length ? '<button class="link" data-a="planClear">Clear</button>' : ''}<button class="btn" data-a="planGo" ${pick.length ? '' : 'disabled'}>${ic('nav')}Open route</button></div></div>`;
}
function routeUrl(ids) {
  let stops = ids.map(id => X.salon[id]).filter(s => s && s.lat && s.lng);
  if (ui.pos) { const out = []; let cur = { lat: ui.pos.lat, lng: ui.pos.lng }; while (stops.length) { stops.sort((a, b) => dist(cur.lat, cur.lng, num(a.lat), num(a.lng)) - dist(cur.lat, cur.lng, num(b.lat), num(b.lng))); const n = stops.shift(); out.push(n); cur = { lat: num(n.lat), lng: num(n.lng) }; } stops = out; }
  const last = stops[stops.length - 1], mids = stops.slice(0, -1);
  return `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${last.lat},${last.lng}${mids.length ? '&waypoints=' + encodeURIComponent(mids.map(s => s.lat + ',' + s.lng).join('|')) : ''}${ui.pos ? `&origin=${ui.pos.lat},${ui.pos.lng}` : ''}`;
}

/* TARGETS AND COMMISSION */
const TMETRICS = [['visits', 'Visits'], ['newSalons', 'New salons'], ['orders', 'Orders'], ['units', 'Units'], ['value', 'Order value']];
const tgt = (email, month) => S.targets.find(t => t.month === month && lc(t.email) === email) || {};
const commissionOn = () => num(S.settings.commissionPct) > 0 || num(S.settings.commissionPerUnit) > 0;
function bars(email, month) {
  const a = monthActuals(email, month, S), t = tgt(email, month);
  const rows = TMETRICS.filter(([k]) => num(t[k]) > 0).map(([k, l]) => {
    const pct = Math.min(100, Math.round(a[k] / num(t[k]) * 100));
    const fmt = v => k === 'value' ? money0(v) : v;
    return `<div class="tg"><div class="tgh"><span>${l}</span><span><b>${fmt(a[k])}</b> of ${fmt(num(t[k]))}</span></div><div class="bar2"><span style="width:${pct}%;${pct >= 100 ? 'background:var(--ok)' : ''}"></span></div></div>`;
  }).join('');
  const com = commissionOn() ? `<div class="tgh" style="margin-top:10px"><span>Commission so far</span><b>${money(commissionFor(a, S.settings))}</b></div><div class="tiny muted">From ${a.deliveredUnits} units delivered this month${num(S.settings.commissionPct) ? ', ' + S.settings.commissionPct + '% of value before VAT' : ''}${num(S.settings.commissionPerUnit) ? ', AED ' + S.settings.commissionPerUnit + ' per unit' : ''}</div>` : '';
  return { html: rows + com, has: !!(rows || com), a };
}
function myMonthCard() {
  const m = today().slice(0, 7), b = bars(S.me.email, m);
  if (!b.has) return '';
  const d = new Date(), left = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() - d.getDate();
  return `<div class="sec"><h2>My month</h2><span class="small muted">${left} days left</span></div><div class="card">${b.html}</div>`;
}
function vTargets() {
  const m = ui.tMonth, label = new Date(m + '-15').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  const people = isAdminMe() ? S.users.filter(u => u.active !== 'no') : S.users.filter(u => u.email === S.me.email);
  return `${topbar('Targets', isAdminMe() ? `<button class="ib" data-a="targetSheet" aria-label="Edit targets">${ic('edit')}</button>` : '')}<div class="wrap" style="padding-top:0">
  <div class="mnav"><button class="ib" data-a="tMonth" data-d="-1" aria-label="Previous month">${ic('back')}</button><b>${label}</b><button class="ib" data-a="tMonth" data-d="1" aria-label="Next month" style="transform:scaleX(-1)">${ic('back')}</button></div>
  ${people.map(u => { const b = bars(u.email, m); return `<div class="card"><div style="display:flex;align-items:center;margin-bottom:8px">${avatar(u.email, 30)}<b>${esc(u.name)}</b></div>${b.has ? b.html : `<div class="small muted">No targets set${isAdminMe() ? '. Tap the pencil to set them.' : ' yet.'} This month: ${b.a.visits} visits, ${b.a.newSalons} new salons, ${b.a.orders} orders, ${b.a.units} units.</div>`}</div>`; }).join('')}
  ${isAdminMe() ? `<button class="btn block" data-a="targetSheet">${ic('target')}Set targets for ${esc(label)}</button>${commissionOn() ? '' : '<p class="tiny muted" style="text-align:center">Turn on commission with commissionPct or commissionPerUnit in the Settings tab.</p>'}` : ''}</div>`;
}
function targetSheet() {
  const m = ui.tMonth, users = S.users.filter(u => u.active !== 'no');
  openSheet('Targets for ' + new Date(m + '-15').toLocaleDateString('en-GB', { month: 'long' }), users.map(u => { const t = tgt(u.email, m); return `<div class="fs">${esc(u.name)}</div><div class="tgrid">${TMETRICS.map(([k, l]) => `<label class="f"><span>${l}</span><input inputmode="numeric" data-tu="${esc(u.email)}" data-tk="${k}" value="${esc(t[k] || '')}"></label>`).join('')}</div>`; }).join('')
    + '<p class="tiny muted">Order value is before VAT and delivery. Leave empty for no target.</p>' + (S.targets.some(t => t.month < m) ? `<button class="btn ghost sm" data-a="copyTargets">Copy last month</button>` : ''),
    `<button class="btn block" data-a="saveTargets">${ic('check')}Save targets</button>`);
}

/* ZOHO on orders */
const ZST = { draft: ['Draft in Zoho', ''], sent: ['Sent, unpaid', 'warn'], overdue: ['Overdue', 'bad'], partially_paid: ['Part paid', 'warn'], paid: ['Paid', 'ok'], void: ['Void', ''], viewed: ['Viewed, unpaid', 'warn'], unpaid: ['Unpaid', 'warn'] };
const zConnected = () => S.settings.zohoConnected === 'yes';
function zohoBlock(o) {
  if (!zConnected() && !o.zohoInvoiceId) return '';
  if (o.zohoInvoiceId) {
    const [l, c] = ZST[o.zohoStatus] || [o.zohoStatus || 'Unknown', ''];

      <dt>Invoice</dt><dd><b>${esc(o.zohoInvoice)}</b></dd><dt>Total</dt><dd>${money(o.zohoTotal)}</dd><dt>Balance due</dt><dd style="${num(o.zohoBalance) > 0 ? 'color:var(--bad)' : 'color:var(--ok)'}"><b>${money(o.zohoBalance)}</b></dd>
      <dt>Checked</dt><dd>${o.zohoSyncedAt ? ago(o.zohoSyncedAt).toLowerCase() : ''}</dd></dl>
      ${zConnected() ? `<div style="padding:0 16px 14px"><button class="btn ghost sm" data-a="zohoRefresh" data-id="${o.id}">${ic('refresh')}Check Zoho now</button></div>` : ''}</div>`;
  }
  if (o.zohoError) return `<div class="warnbox" style="background:var(--bad-soft);color:var(--bad)">Zoho invoice not created: ${esc(o.zohoError)}</div>`;
  return '';
}
const zohoPayPill = o => o.zohoInvoiceId && ZST[o.zohoStatus] ? `<span class="pill ${ZST[o.zohoStatus][1]} tiny">${o.zohoStatus === 'draft' ? 'Zoho draft' : ZST[o.zohoStatus][0]}</span>` : '';

/* handlers */
Object.assign(H, {
  flush: () => flush(),
  openRadar: () => go('radar'), openTargets: () => go('targets'),
  openPlan: () => { go('plan'); if (ui.planArea === 'near') getPos(); },
  planArea: id => { ui.planArea = id; if (id === 'near') getPos(); render(); },
  planToggle(id) { const i = ui.planPick.indexOf(id); if (i >= 0) ui.planPick.splice(i, 1); else if (ui.planPick.length >= 10) { toast('Google Maps takes up to 10 stops.', 'bad'); return; } else ui.planPick.push(id); LS.set('tbl_plan_' + new Date().toISOString().slice(0, 10), ui.planPick); render(); },
  planClear() { ui.planPick = []; LS.set('tbl_plan_' + new Date().toISOString().slice(0, 10), []); render(); },
  planGo() { const ids = ui.planPick.filter(id => X.salon[id] && X.salon[id].lat); if (!ids.length) return; const go2 = () => window.open(routeUrl(ids), '_blank'); if (!ui.pos) getPos(go2, true); go2(); },
  setSort: id => { ui.sort = id; if (id === 'near') getPos(); render(); },
  tMonth(_, el) { const [y, m] = ui.tMonth.split('-').map(Number), d = new Date(y, m - 1 + +el.dataset.d, 15); ui.tMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); render(); },
  targetSheet: () => targetSheet(),
  copyTargets() { const prev = S.targets.filter(t => t.month < ui.tMonth).map(t => t.month).sort().pop(); document.querySelectorAll('.sheet [data-tu]').forEach(i => { const t = tgt(i.dataset.tu, prev); if (t[i.dataset.tk]) i.value = t[i.dataset.tk]; }); toast('Copied from ' + prev); },
  async saveTargets() {
    const rows = {}; document.querySelectorAll('.sheet [data-tu]').forEach(i => { (rows[i.dataset.tu] = rows[i.dataset.tu] || { email: i.dataset.tu })[i.dataset.tk] = i.value.trim(); });
    try { await run('saveTargets', { month: ui.tMonth, rows: Object.values(rows) }, 'Targets saved'); closeSheet(); } catch (e) {}
  },
  async zohoInvoice(id) { try { await run('zohoInvoice', { id }, 'Zoho invoice created'); } catch (e) {} },
  async zohoRefresh(id) { try { await run('zohoRefresh', { id }, 'Updated from Zoho'); } catch (e) {} }
});

/* ---------- 3.2 handlers ---------- */
Object.assign(H, {
  hType: id => { ui.hType = id; render(); },
  logUser: id => { ui.logUser = id; render(); }, logType: id => { ui.logType = id; render(); },
